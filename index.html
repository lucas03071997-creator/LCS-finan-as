<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LCS Finanças — Controle Financeiro</title>
<meta name="theme-color" content="#0A8754">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LCS">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#0A8754;
    --brand-dark:#065F3A;
    --brand-light:#E8F5E9;
    --success:#2ECC71;
    --danger:#E53935;
    --danger-light:#FDECEA;
    --slate:#475569;
    --slate-light:#EEF2F6;
    --ink:#F8F9FA;
    --panel:#FFFFFF;
    --panel-2:#F9FAFB;
    --edge: #E0E0E0;
    --edge-strong: #D4D4D4;
    --paper:#1A1D1E;
    --muted:#6C757D;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--ink); color:var(--paper); font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; height:100%; -webkit-font-smoothing:antialiased;}
  #root{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative; background:var(--ink); border-left:1px solid var(--edge); border-right:1px solid var(--edge);}

  .topbar{
    padding: calc(14px + env(safe-area-inset-top)) 18px 14px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    border-bottom:1px solid var(--edge);
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    position: sticky; top: 0; z-index: 20;
  }
  .topbar-left{display:flex; align-items:center; gap:10px; min-width:0;}
  .logo-mark{width:36px; height:36px; flex-shrink:0;}
  .brand-text{display:flex; flex-direction:column; line-height:1.15; min-width:0;}
  .brand-text .b1{font-size:16px; font-weight:800; letter-spacing:-0.02em; color:var(--paper); white-space:nowrap;}
  .brand-text .b1 span{color:var(--muted); font-weight:400;}
  .brand-text .sub{font-size:10.5px; color:var(--muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .topbar-right{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .icon-circle{width:36px; height:36px; border-radius:999px; border:1px solid var(--edge); background:var(--panel-2); display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; flex-shrink:0;}
  .icon-circle svg{width:17px; height:17px; stroke:var(--muted); fill:none; stroke-width:1.8;}

  main#content{flex:1; padding:18px 16px 92px; overflow-y:auto;}
  nav.bottomnav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    display:flex; background:#FFFFFF; border-top:1px solid var(--edge);
    box-shadow:0 -4px 16px rgba(0,0,0,0.05);
    padding:8px 4px calc(6px + env(safe-area-inset-bottom));
    max-width:520px; width:100%; z-index:30;
  }
  .nav-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:var(--muted); font-family:'Inter', sans-serif; font-size:10px; font-weight:400; cursor:pointer; padding:6px 2px 4px; border-radius:10px; position:relative;}
  .nav-btn svg{width:20px; height:20px; stroke:var(--muted); fill:none; stroke-width:1.9;}
  .nav-btn.active{color:var(--brand); font-weight:600; background:var(--brand-light);}
  .nav-btn.active svg{stroke:var(--brand);}
  .nav-btn.active.pessoal-tab{background:var(--slate-light); color:var(--slate);}
  .nav-btn.active.pessoal-tab svg{stroke:var(--slate);}

  .month-switch{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .month-switch .m-label{font-family:'Inter',sans-serif; font-size:19px; font-weight:700; letter-spacing:-0.02em; text-transform:capitalize;}
  .month-switch .m-btns{display:flex; gap:6px;}
  .m-btn{width:34px; height:34px; border-radius:999px; border:1px solid var(--edge); background:var(--panel); color:var(--paper); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px;}

  .card{background:var(--panel); border:1px solid var(--edge); border-radius:16px; padding:16px; box-shadow:0 4px 20px rgba(17,24,39,0.04);}
  .quick-actions{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
  .quick-action{display:flex; align-items:center; gap:10px; padding:13px 14px; border-radius:14px; border:1px solid var(--edge); background:var(--panel); cursor:pointer;}
  .quick-action .qa-icon{width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .quick-action.empresa .qa-icon{background:var(--brand-light); color:var(--brand);}
  .quick-action.pessoal .qa-icon{background:var(--slate-light); color:var(--slate);}
  .quick-action .qa-icon svg{width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.9;}
  .quick-action .qa-label{font-size:12.5px; font-weight:600; color:var(--paper);}
  .quick-action .qa-sub{font-size:10.5px; color:var(--muted);}

  .hero-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .hero-split{padding:16px 15px; border-radius:16px; border:1px solid var(--edge);}
  .hero-split.empresa{background:linear-gradient(135deg, var(--brand), var(--brand-dark)); border:none;}
  .hero-split.empresa .label{color:rgba(255,255,255,0.82);}
  .hero-split.empresa .value{color:#fff;}
  .hero-split.pessoal{background:var(--panel);}
  .hero-split.pessoal .label{color:var(--muted);}
  .hero-split.pessoal .value{color:var(--paper);}
  .hero-split .label{font-size:11px; display:flex; align-items:center; gap:6px; font-weight:600;}
  .hero-split .value{font-family:'Inter',sans-serif; font-size:22px; font-weight:700; margin-top:6px; letter-spacing:-0.02em;}

  .scope-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .scope-col{display:flex; flex-direction:column; gap:8px;}
  .scope-col-title{font-size:12px; font-weight:700; display:flex; align-items:center; gap:6px; color:var(--paper);}

  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .mini-card{padding:13px 14px; border-radius:14px; border:1px solid var(--edge); background:var(--panel);}
  .mini-card.in{background:var(--brand-light); border-color:transparent;}
  .mini-card.out{background:var(--danger-light); border-color:transparent;}
  .mini-card .lbl{font-size:11px; color:var(--muted); margin-bottom:5px; font-weight:600;}
  .mini-card .val{font-family:'Inter',sans-serif; font-size:15px; font-weight:700;}
  .mini-card.in .val{color:var(--brand-dark);}
  .mini-card.out .val{color:var(--danger);}

  .section-title{font-family:'Inter',sans-serif; font-size:16px; font-weight:700; margin:24px 0 10px; display:flex; align-items:center; justify-content:space-between; color:var(--paper);}
  .section-title .tag{font-size:11px; color:var(--brand); font-weight:600;}

  .dot{width:7px; height:7px; border-radius:999px; display:inline-block;}
  .dot.empresa{background:var(--brand);}
  .dot.pessoal{background:var(--slate);}

  .cat-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--edge);}
  .cat-row:last-child{border-bottom:none;}
  .cat-row .cname{flex:1; font-size:13px; color:var(--paper);}
  .cat-row .cbar-wrap{flex:1; height:6px; border-radius:4px; background:var(--panel-2); overflow:hidden; margin:0 10px;}
  .cat-row .cbar{height:100%; border-radius:4px;}
  .cat-row .camt{font-family:'Inter',sans-serif; font-size:12px; font-weight:600; min-width:78px; text-align:right;}

  .empty{text-align:center; padding:34px 12px; color:var(--muted); font-size:13px; line-height:1.6;}

  .report-summary{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .report-card{padding:14px; border-radius:14px; border:1px solid var(--edge); background:var(--panel);}
  .report-card .lbl{font-size:11px; color:var(--muted); margin-bottom:5px; font-weight:600;}
  .report-card .val{font-size:17px; font-weight:700;}
  .report-card.in .val{color:var(--brand-dark);}
  .report-card.out .val{color:var(--danger);}
  .report-card.balance .val{color:var(--slate);}
  .report-card.total .val{color:var(--paper);}
  .report-scope{margin-bottom:14px;}
  .report-scope-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; font-size:13px; font-weight:700;}
  .report-scope-head .total{font-size:12px; color:var(--muted); font-weight:600;}
  .report-row{display:flex; align-items:center; gap:9px; padding:10px 0; border-bottom:1px solid var(--edge);}
  .report-row:last-child{border-bottom:none;}
  .report-row .name{width:108px; flex-shrink:0; font-size:12px; color:var(--paper); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .report-row .bar-wrap{flex:1; height:7px; border-radius:5px; background:var(--panel-2); overflow:hidden;}
  .report-row .bar{height:100%; border-radius:5px; background:var(--brand);}
  .report-row.out .bar{background:var(--danger);}
  .report-row .amount{min-width:78px; text-align:right; font-size:11.5px; font-weight:700;}
  .report-row.out .amount{color:var(--danger);}
  .report-row.in .amount{color:var(--brand-dark);}
  .flow-card{margin-top:14px;}
  .flow-card h4{font-size:13px; margin:0 0 6px; font-weight:700; color:var(--paper);}
  .flow-card .hint{font-size:11px; color:var(--muted); margin:0 0 9px; line-height:1.4;}
  .flow-row{display:grid; grid-template-columns:102px 1fr 78px; gap:8px; align-items:center; padding:9px 0; border-bottom:1px solid var(--edge);}
  .flow-row:last-child{border-bottom:none;}
  .flow-name{font-size:11.5px; color:var(--paper); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .flow-name small{display:block; color:var(--muted); font-size:9.5px; margin-top:2px;}
  .flow-bar{height:8px; border-radius:5px; background:var(--panel-2); overflow:hidden;}
  .flow-bar i{display:block; height:100%; border-radius:5px;}
  .flow-bar.in i{background:var(--brand);}
  .flow-bar.out i{background:var(--danger);}
  .flow-value{text-align:right; font-size:11px; font-weight:700; white-space:nowrap;}
  .flow-value.in{color:var(--brand-dark);}
  .flow-value.out{color:var(--danger);}
  .tips-card{margin-top:14px; background:linear-gradient(135deg,#F5FAF7,#FFFFFF);}
  .tip{display:flex; gap:9px; padding:9px 0; border-bottom:1px solid var(--edge); font-size:11.5px; line-height:1.45; color:var(--paper);}
  .tip:last-child{border-bottom:none; padding-bottom:0;}
  .tip:first-child{padding-top:0;}
  .tip-mark{width:22px; height:22px; flex-shrink:0; border-radius:7px; background:var(--brand-light); color:var(--brand-dark); display:flex; align-items:center; justify-content:center; font-weight:800;}
  .report-filter{display:flex; gap:8px; margin:-2px 0 14px;}
  .report-filter button{flex:1; padding:9px 6px; border-radius:10px; border:1px solid var(--edge); background:var(--panel); color:var(--muted); font-size:11px; font-weight:700; cursor:pointer;}
  .report-filter button.active{background:var(--brand-light); border-color:var(--brand); color:var(--brand-dark);}
  .pdf-actions{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px;}
  .pdf-btn{padding:11px 8px; border:0; border-radius:11px; color:#fff; font-size:11px; font-weight:700; cursor:pointer;}
  .pdf-btn.empresa{background:linear-gradient(135deg, var(--brand), var(--brand-dark));}
  .pdf-btn.pessoal{background:var(--slate);}
  .fixed-scope{margin-bottom:18px;}
  .fixed-scope-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:9px;}
  .fixed-scope-title{display:flex; align-items:center; gap:7px; font-size:16px; font-weight:800;}
  .fixed-total{font-size:12px; color:var(--muted); font-weight:600;}
  .fixed-item{display:flex; align-items:center; gap:10px; padding:12px 4px; border-bottom:1px solid var(--edge);}
  .fixed-item:last-child{border-bottom:none;}
  .fixed-icon{width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
  .fixed-icon.empresa{background:var(--brand-light); color:var(--brand-dark);}
  .fixed-icon.pessoal{background:var(--slate-light); color:var(--slate);}
  .fixed-mid{flex:1; min-width:0;}
  .fixed-name{font-size:13px; font-weight:700; color:var(--paper); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .fixed-meta{font-size:10.5px; color:var(--muted); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .fixed-value{font-size:12.5px; font-weight:800; text-align:right; white-space:nowrap;}
  .fixed-value.in{color:var(--brand-dark);}
  .fixed-value.out{color:var(--danger);}
  .fixed-actions{display:flex; gap:5px; margin-left:5px;}
  .fixed-action{width:27px; height:27px; border:1px solid var(--edge); border-radius:8px; background:var(--panel-2); color:var(--muted); font-size:12px; cursor:pointer;}
  .fixed-add{width:100%; margin-top:8px; padding:11px; border:1.5px dashed var(--edge-strong); border-radius:11px; background:transparent; font-size:12px; font-weight:700; cursor:pointer;}
  .fixed-add.empresa{color:var(--brand-dark);}
  .fixed-add.pessoal{color:var(--slate);}
  .fixed-empty{padding:12px 4px; color:var(--muted); font-size:12px; text-align:center;}

  .tx-item{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--edge); cursor:pointer;}
  .tx-item:last-child{border-bottom:none;}
  .tx-icon{width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;}
  .tx-mid{flex:1; min-width:0;}
  .tx-cat{font-size:13.5px; font-weight:600; color:var(--paper);}
  .tx-meta{font-size:11.5px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tx-amt{font-family:'Inter',sans-serif; font-size:13.5px; font-weight:700; white-space:nowrap;}
  .tx-amt.in{color:var(--brand-dark);}
  .tx-amt.out{color:var(--danger);}

  .btn-primary{width:100%; padding:14px; border-radius:12px; border:none; font-family:'Inter', sans-serif; font-weight:700; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;}
  .btn-primary.empresa{background:linear-gradient(135deg, var(--brand), var(--brand-dark)); color:#fff;}
  .btn-primary.pessoal{background:var(--slate); color:#fff;}

  .head-scope{margin-bottom:4px;}
  .head-scope .h-title{font-family:'Inter',sans-serif; font-size:23px; font-weight:800; letter-spacing:-0.02em;}
  .head-scope .h-title.empresa{color:var(--brand-dark);}
  .head-scope .h-title.pessoal{color:var(--slate);}

  .acc-card{display:flex; align-items:center; gap:12px; padding:13px; border-radius:14px; border:1px solid var(--edge); background:var(--panel); margin-bottom:10px;}
  .acc-mid{flex:1; min-width:0;}
  .acc-name{font-size:14px; font-weight:600; color:var(--paper);}
  .acc-bal{font-family:'Inter',sans-serif; font-size:13px; color:var(--muted); margin-top:2px; font-weight:600;}
  .acc-actions{display:flex; gap:6px;}
  .icon-btn{width:32px; height:32px; border-radius:9px; border:1px solid var(--edge); background:var(--panel-2); color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer;}

  .add-acc-btn{width:100%; padding:13px; border-radius:12px; border:1.5px dashed var(--edge-strong); background:transparent; color:var(--brand-dark); font-weight:700; font-size:13.5px; cursor:pointer; margin-top:6px;}

  .overlay{position:fixed; inset:0; background:rgba(17,24,39,0.5); backdrop-filter: blur(4px); display:none; align-items:flex-end; justify-content:center; z-index:50;}
  .overlay.show{display:flex;}
  .sheet{width:100%; max-width:520px; background:var(--panel); border-radius:22px 22px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;}
  .sheet-handle{width:36px; height:4px; background:var(--edge-strong); border-radius:99px; margin:0 auto 14px;}
  .sheet h3{font-family:'Inter',sans-serif; font-size:18px; margin:0 0 16px; font-weight:700; color:var(--paper);}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11.5px; color:var(--muted); margin-bottom:6px; font-weight:600;}
  .field input, .field select{width:100%; min-height:48px; padding:11px 12px; background:#F9FAFB; border:1px solid var(--edge); border-radius:12px; color:var(--paper); font-family:'Inter', sans-serif; font-size:14px; outline:none;}

  .toggle-row{display:flex; gap:8px; margin-bottom:14px;}
  .toggle-opt{flex:1; text-align:center; padding:12px; border-radius:12px; border:1px solid var(--edge); font-size:13px; font-weight:700; cursor:pointer; color:var(--muted); background:var(--panel-2);}
  .toggle-opt.sel-in{background:var(--brand-light); border-color:var(--brand); color:var(--brand-dark);}
  .toggle-opt.sel-out{background:var(--danger-light); border-color:var(--danger); color:var(--danger);}
  .toggle-opt.sel-pessoal{background:var(--slate-light); border-color:var(--slate); color:var(--slate);}

  .logo-pick{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .logo-preview{width:52px; height:52px; border-radius:14px; background:var(--panel-2); border:1px solid var(--edge); display:flex; align-items:center; justify-content:center; overflow:hidden; font-family:'Inter',sans-serif; font-size:17px; font-weight:700; color:var(--paper);}
  .logo-preview img{width:100%; height:100%; object-fit:cover;}
  .upload-btn{padding:10px 14px; border-radius:10px; border:1px solid var(--edge); background:var(--panel-2); color:var(--paper); font-size:12.5px; font-weight:700; cursor:pointer;}

  .sheet-actions{display:flex; gap:10px; margin-top:16px;}
  .btn{flex:1; padding:14px; border-radius:12px; border:none; font-weight:700; font-size:14px; cursor:pointer;}
  .btn.save{background:linear-gradient(135deg, var(--brand), var(--brand-dark)); color:#fff;}
  .btn.danger{background:var(--danger-light); color:var(--danger);}
  .btn.ghost{background:transparent; color:var(--muted); border:1px solid var(--edge);}

  .hide-balances .val, .hide-balances .value, .hide-balances .acc-bal,
  .hide-balances .tx-amt, .hide-balances .camt, .hide-balances .line b{
    filter: blur(7px); user-select:none;
  }
</style>
</head>
<body>
<div id="root">
  <header class="topbar">
    <div class="topbar-left">
      <img class="logo-mark" src="icon-192.png" alt="Logo LCS Finanças">
      <div class="brand-text">
        <div class="b1">LCS <span>Finanças</span></div>
        <div class="sub">empresa &amp; pessoal</div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="icon-circle" id="importBtn" onclick="openImportSheet()" title="Importar extrato do banco">
        <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7.5 9.5L12 5l4.5 4.5"/><path d="M4.5 16.5v2a2 2 0 002 2h11a2 2 0 002-2v-2"/></svg>
      </button>
      <button class="icon-circle" id="eyeToggle" onclick="toggleBalances()">
        <svg viewBox="0 0 24 24" id="eyeIcon"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </header>

  <main id="content"></main>

  <nav class="bottomnav">
    <button class="nav-btn" data-tab="dashboard" onclick="setTab('dashboard')">
      <svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8"/><path d="M5 10v9h14v-9"/></svg>
      Início
    </button>
    <button class="nav-btn pessoal-tab" data-tab="pessoal" onclick="setTab('pessoal')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>
      Pessoal
    </button>
    <button class="nav-btn" data-tab="empresa" onclick="setTab('empresa')">
      <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="1"/><path d="M8 8V6a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
      Empresa
    </button>
    <button class="nav-btn" data-tab="fixas" onclick="setTab('fixas')">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      Fixas
    </button>
    <button class="nav-btn" data-tab="relatorios" onclick="setTab('relatorios')">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M11 20V4M18 20v-7"/></svg>
      Relatórios
    </button>

    return val ? { value: val } : null;

    saida: [{k:'investimento', l:'Investimentos'},{k:'anuncios', l:'Anúncios e publicidade'},{k:'aluguel', l:'Aluguel / estrutura'},{k:'folha', l:'Folha de pagamento'},{k:'fornecedores', l:'Fornecedores'},{k:'impostos', l:'Impostos e taxas'},{k:'equipamentos', l:'Equipamentos'},{k:'software', l:'Software e ferramentas'},{k:'transporte_empresa', l:'Transporte'},{k:'servicos_terceiros', l:'Serviços de terceiros'},{k:'tarifas', l:'Tarifas bancárias'},{k:'outras_saidas', l:'Outras saídas'}]

    saida: [{k:'moradia', l:'Moradia'},{k:'alimentacao', l:'Alimentação'},{k:'supermercado', l:'Supermercado'},{k:'transporte', l:'Transporte / Uber'},{k:'saude', l:'Saúde'},{k:'educacao', l:'Educação'},{k:'lazer', l:'Lazer'},{k:'familia', l:'Família e filhos'},{k:'vestuario', l:'Vestuário'},{k:'contas', l:'Contas e assinaturas'},{k:'emprestimo_pagamento', l:'Pagamento de empréstimo'},{k:'cartao', l:'Cartão de crédito'},{k:'outras_saidas', l:'Outras saídas pessoais'}]
  }
};

const BANKS = [
  {id:'nubank', name:'Nubank', color:'#8A05BE', initials:'NU'},
  {id:'itau', name:'Itaú', color:'#EC7000', initials:'IT'},
  {id:'bradesco', name:'Bradesco', color:'#CC092F', initials:'BR'},

  {id:'sicredi', name:'Sicredi', color:'#7AB800', initials:'SI'},

const BANK_DOMAINS = {

  btg:'btgpactual.com', original:'original.com.br', neon:'neon.com.br', sicoob:'sicoob.com.br',
  sicredi:'sicredi.com.br', pagbank:'pagbank.com.br', mercadopago:'mercadopago.com.br', stone:'stone.com.br',

};
function bankById(id){ return BANKS.find(b=>b.id===id) || BANKS[BANKS.length-1]; }
function bankDisplayName(acc){ if(!acc) return ''; return acc.bankId==='outro' ? (acc.customBank || 'Outro banco') : bankById(acc.bankId).name; }
function bankBadgeHTML(bankId, size, customBank){
  const b = bankById(bankId);
  const s = size || 36;
  let initials = b.initials;
  if(bankId==='outro' && customBank && customBank.trim()) initials = customBank.trim().slice(0,2).toUpperCase();
  const radius = Math.round(s*0.28);
  const domain = BANK_DOMAINS[bankId];
  // Tenta carregar a logo oficial do banco (via serviço público de logos por domínio);
  // se falhar (sem internet, ou banco não coberto), remove a imagem e mantém o badge colorido com a sigla.
  const logoImg = domain ? `<img src="https://logo.clearbit.com/${domain}?size=${s*2}" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#fff; border-radius:${radius}px; padding:${Math.max(2,Math.round(s*0.1))}px;" onerror="this.remove()" loading="lazy">` : '';
  return `<div style="position:relative; width:${s}px;height:${s}px;border-radius:${radius}px;background:${b.color};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:${Math.round(s*0.34)}px;flex-shrink:0;overflow:hidden;">${initials}${logoImg}</div>`;
}

let state = { accounts: [], transactions: [], recurring: [], activeTab: 'dashboard', reportScope: 'todos', month: null, ready: false, showMonthPicker: false };
const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

function fmt(n){ return (Number(n)||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'}); }
// Máscara de valor no padrão brasileiro (vírgula decimal, ex.: 1.234,56).
// Formata o número atual para exibição no campo:
function moneyMaskValue(n){ return Math.abs(Number(n)||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
// Reformata o campo a cada tecla digitada (dígitos entram pela direita, como numa calculadora) e devolve o valor numérico via setter:
function maskMoneyInput(el, setter){
  let digits = el.value.replace(/\D/g,'');
  digits = digits.replace(/^0+(?=\d)/,'');
  while(digits.length < 3) digits = '0' + digits;
  const cents = digits.slice(-2);
  let intPart = digits.slice(0, -2).replace(/^0+(?=\d)/,'') || '0';
  const intFormatted = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  el.value = `${intFormatted},${cents}`;
  setter(parseFloat(`${intPart}.${cents}`));
}
// Campo de valor com "R$" fixo à esquerda (fora do texto editável) e o restante mascarado em tempo real.
function moneyInputHTML(opts){
  const { id='', value=0, onInput='', height=48, fontSize=14, wrapperStyle='' } = opts;
  const big = height >= 44;
  return `<div style="display:flex; align-items:stretch; border:1px solid var(--edge); border-radius:${big?12:8}px; overflow:hidden; background:#F9FAFB; ${wrapperStyle}">
    <span style="display:flex; align-items:center; padding:0 ${big?10:8}px; font-weight:700; color:var(--muted); font-size:${Math.max(11,fontSize-1)}px; border-right:1px solid var(--edge); background:#F1F3F5; flex-shrink:0;">R$</span>
    <input type="text" inputmode="numeric" ${id?`id="${id}"`:''} value="${moneyMaskValue(value)}" oninput="${onInput}" placeholder="0,00" style="border:none; background:transparent; flex:1; min-width:0; min-height:${height}px; padding:6px 8px; font-family:'Inter',sans-serif; font-size:${fontSize}px; color:var(--paper); outline:none;">
  </div>`;
}
function todayISO(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

async function loadAll(){
  try{ const a = await StorageProvider.get('fin_accounts'); state.accounts = a && a.value ? JSON.parse(a.value) : []; }catch(e){ state.accounts = []; }
  try{ const t = await StorageProvider.get('fin_transactions'); state.transactions = t && t.value ? JSON.parse(t.value) : []; }catch(e){ state.transactions = []; }
  try{ const r = await StorageProvider.get('fin_recurring'); state.recurring = r && r.value ? JSON.parse(r.value) : []; }catch(e){ state.recurring = []; }
  const now = new Date(); state.month = {y: now.getFullYear(), m: now.getMonth()}; state.ready = true; render();
}

async function saveAccounts(){ await StorageProvider.set('fin_accounts', JSON.stringify(state.accounts)); }
async function saveTransactions(){ await StorageProvider.set('fin_transactions', JSON.stringify(state.transactions)); }
async function saveRecurring(){ await StorageProvider.set('fin_recurring', JSON.stringify(state.recurring)); }

function txInMonth(tx, y, m){ if(!tx.date) return false; const parts = tx.date.split('-'); return parseInt(parts[0], 10) === y && (parseInt(parts[1], 10) - 1) === m; }
function monthTx(scope){ return state.transactions.filter(t => (!scope || t.scope===scope) && txInMonth(t, state.month.y, state.month.m)); }
function sumBy(list, type){ return list.filter(t=>t.type===type).reduce((s,t)=>s+Number(t.amount||0),0); }

function accountBalance(accId){
  const acc = state.accounts.find(a=>a.id===accId); if(!acc) return 0;
  let bal = Number(acc.initialBalance||0);
  state.transactions.forEach(t=>{ if(t.accountId===accId){ bal += (t.type==='entrada' ? Number(t.amount||0) : -Number(t.amount||0)); }});
  return bal;
}
function totalBalanceByType(type){ return state.accounts.filter(a => type==='pessoal' ? a.type==='pessoal' : a.type!=='pessoal').reduce((s,a)=>s+accountBalance(a.id),0); }
function catLabel(scope,type,key){ if(!CATS[scope] || !CATS[scope][type]) return key; const found = CATS[scope][type].find(c=>c.k===key); return found ? found.l : key; }

function toggleBalances(){
  const hidden = document.body.classList.toggle('hide-balances');
  document.getElementById('eyeIcon').innerHTML = hidden
    ? '<path d="M3 3l18 18" stroke-linecap="round"/><path d="M10.6 10.6a3 3 0 004.2 4.2"/><path d="M9.5 5.3A10.9 10.9 0 0112 5c6.4 0 10 7 10 7a17.7 17.7 0 01-3.2 4.1M6.6 6.6C4 8.3 2 12 2 12s3.6 7 10 7c1.4 0 2.6-.3 3.7-.8"/>'
    : '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>';
}
function setTab(tab){ state.activeTab = tab; render(); document.getElementById('content').scrollTop = 0; }
function shiftMonth(delta){ let m = state.month.m + delta; let y = state.month.y; if(m<0){m=11; y--;} if(m>11){m=0; y++;} state.month = {y,m}; render(); }

function monthSwitchHTML(){
  return `<div class="month-switch">
    <div class="m-label" onclick="toggleMonthPicker()" style="cursor:pointer;">${MONTHS[state.month.m]} de ${state.month.y} <span style="font-size:11px;color:var(--muted);">▾</span></div>
    <div class="m-btns"><button class="m-btn" onclick="shiftMonth(-1)">‹</button><button class="m-btn" onclick="shiftMonth(1)">›</button></div>
  </div>
  ${state.showMonthPicker ? `<div style="display:flex; gap:8px; margin:-10px 0 16px;">
    <select id="mp-month" onchange="applyMonthPicker()" style="flex:1; min-height:40px; border:1px solid var(--edge); border-radius:10px; padding:8px; background:#F9FAFB; font-family:'Inter',sans-serif; color:var(--paper); font-size:13px;">
      ${MONTHS.map((mn,i)=>`<option value="${i}" ${i===state.month.m?'selected':''}>${mn.charAt(0).toUpperCase()+mn.slice(1)}</option>`).join('')}
    </select>
    <select id="mp-year" onchange="applyMonthPicker()" style="width:96px; min-height:40px; border:1px solid var(--edge); border-radius:10px; padding:8px; background:#F9FAFB; font-family:'Inter',sans-serif; color:var(--paper); font-size:13px;">
      ${yearOptionsHTML()}
    </select>
  </div>` : ''}`;
}
function yearOptionsHTML(){
  const current = new Date().getFullYear();
  const years = [];
  for(let y=current-5; y<=current+1; y++) years.push(y);
  if(!years.includes(state.month.y)) years.push(state.month.y);
  years.sort((a,b)=>a-b);
  return years.map(y=>`<option value="${y}" ${y===state.month.y?'selected':''}>${y}</option>`).join('');
}
function toggleMonthPicker(){ state.showMonthPicker = !state.showMonthPicker; render(); }
function applyMonthPicker(){
  const m = Number(document.getElementById('mp-month').value);
  const y = Number(document.getElementById('mp-year').value);
  state.month = {y, m};
  render();
}

function flowTotals(list, type){
  const totals = {};
  list.filter(t=>t.type===type).forEach(t=>{
    const key = `${t.scope}|${t.category || 'outro'}`;
    totals[key] = (totals[key] || 0) + Number(t.amount || 0);
  });
  return Object.entries(totals).map(([key, amount])=>{
    const [scope, category] = key.split('|');
    return {scope, category, amount, label:catLabel(scope,type,category)};
  }).sort((a,b)=>b.amount-a.amount);
}

function flowRows(list, type){
  const rows = flowTotals(list,type).slice(0,5);
  if(!rows.length) return '<div class="empty" style="padding:12px 0">Sem dados neste mês.</div>';
  const max = rows[0].amount || 1;
  return rows.map(r=>`<div class="flow-row">
    <div class="flow-name">${r.label}<small>${r.scope==='empresa'?'Empresa':'Pessoal'}</small></div>
    <div class="flow-bar ${type==='entrada'?'in':'out'}"><i style="width:${Math.max(5,r.amount/max*100)}%"></i></div>
    <div class="flow-value ${type==='entrada'?'in':'out'}">${fmt(r.amount)}</div>
  </div>`).join('');
}

function financialTips(list){
  if(!list.length) return ['Adicione seus primeiros lançamentos para receber uma análise personalizada do seu fluxo.'];
  const entradas = sumBy(list,'entrada');
  const saidas = sumBy(list,'saida');
  const tips = [];
  const outRows = flowTotals(list,'saida');
  const inRows = flowTotals(list,'entrada');
  if(saidas > entradas) tips.push(`Suas saídas superam as entradas em ${fmt(saidas-entradas)} neste mês. Revise os gastos não essenciais antes de assumir novos compromissos.`);
  if(outRows[0] && saidas > 0 && outRows[0].amount/saidas >= .4) tips.push(`${outRows[0].label} concentra ${Math.round(outRows[0].amount/saidas*100)}% das suas saídas. Defina um limite para essa categoria e acompanhe-o semanalmente.`);
  if(inRows[0] && entradas > 0) tips.push(`Sua maior fonte de entradas é ${inRows[0].label} (${fmt(inRows[0].amount)}). Evite depender de uma única fonte e mantenha uma reserva para meses mais fracos.`);
  if(entradas > saidas && entradas > 0) tips.push(`Você fechou o mês com saldo positivo de ${fmt(entradas-saidas)}. Considere direcionar parte desse valor para uma reserva de emergência.`);
  if(!inRows.length) tips.push('Não há entradas registradas neste mês. Cadastre receitas e recebimentos para medir o resultado real do período.');
  if(!tips.length) tips.push('Seu fluxo está equilibrado. Continue categorizando os lançamentos para identificar oportunidades de economia.');
  return tips.slice(0,4);
}

function txRowHTML(t, showScope){
  const acc = state.accounts.find(a=>a.id===t.accountId);
  const dateLabel = t.date ? t.date.split('-').reverse().slice(0,2).join('/') : '';
  return `<div class="tx-item" onclick="openTxSheet('${t.scope}','${t.id}')">
    <div class="tx-icon" style="background:${t.type==='entrada'?'var(--brand-light)':'var(--danger-light)'};color:${t.type==='entrada'?'var(--brand-dark)':'var(--danger)'};">${t.type==='entrada'?'↑':'↓'}</div>
    <div class="tx-mid">
      <div class="tx-cat">${catLabel(t.scope,t.type,t.category)}${showScope ? ` <span style="color:var(--muted);font-weight:400;">· ${t.scope==='empresa'?'Empresa':'Pessoal'}</span>` : ''}</div>
      <div class="tx-meta">${dateLabel}${t.description ? ' · '+escHtml(t.description) : ''}${acc ? ' · '+escHtml(acc.name) : ''}</div>
    </div>
    <div class="tx-amt ${t.type==='entrada'?'in':'out'}">${t.type==='entrada'?'+':'−'} ${fmt(t.amount)}</div>
  </div>`;
}
function renderTxList(list, showScope, limit){
  const sorted = list.slice().sort((a,b)=> (b.date||'').localeCompare(a.date||'') || 0);
  const rows = limit ? sorted.slice(0, limit) : sorted;
  if(!rows.length) return '<div class="empty" style="padding:16px 4px">Nenhum lançamento neste período.</div>';
  return rows.map(t=>txRowHTML(t, showScope)).join('');
}

function renderFlowInsights(list){
  const tips = financialTips(list);
  return `<div class="section-title">Onde está seu dinheiro?</div>
    <div class="card flow-card"><h4>Maiores entradas</h4><p class="hint">Categorias com maior participação nas entradas do mês.</p>${flowRows(list,'entrada')}</div>
    <div class="card flow-card"><h4>Maiores saídas</h4><p class="hint">Categorias que mais impactaram seu orçamento.</p>${flowRows(list,'saida')}</div>
    <div class="card tips-card"><h4 style="margin-bottom:10px">Dicas para este fluxo</h4>${tips.map((tip,i)=>`<div class="tip"><span class="tip-mark">${i+1}</span><span>${tip}</span></div>`).join('')}</div>`;
}

function renderDashboard(){
  const mt = monthTx();
  const empTx = mt.filter(t=>t.scope==='empresa');
  const pesTx = mt.filter(t=>t.scope==='pessoal');
  return `
    ${monthSwitchHTML()}
    <div class="quick-actions">
      <div class="quick-action empresa" onclick="openTxSheet('empresa')"><div class="qa-icon">+</div><div><div class="qa-label">Lançamento</div><div class="qa-sub">Empresa</div></div></div>
      <div class="quick-action pessoal" onclick="openTxSheet('pessoal')"><div class="qa-icon">+</div><div><div class="qa-label">Lançamento</div><div class="qa-sub">Pessoal</div></div></div>
    </div>
    <button class="add-acc-btn" style="margin-top:-8px; margin-bottom:14px;" onclick="openImportSheet()">⇪ Importar extrato do banco (OFX/CSV)</button>
    <div class="hero-row">
      <div class="hero-split empresa"><div class="label"><span class="dot empresa"></span> Empresa</div><div class="value">${fmt(totalBalanceByType('empresa'))}</div></div>
      <div class="hero-split pessoal"><div class="label"><span class="dot pessoal"></span> Pessoal</div><div class="value">${fmt(totalBalanceByType('pessoal'))}</div></div>
    </div>
    <div class="section-title">Resumo do Mês</div>
    <div class="scope-grid">
      <div class="scope-col">
        <div class="scope-col-title"><span class="dot empresa"></span> Empresa</div>
        <div class="mini-card in"><div class="lbl">Entradas</div><div class="val">${fmt(sumBy(empTx,'entrada'))}</div></div>
        <div class="mini-card out"><div class="lbl">Saídas</div><div class="val">${fmt(sumBy(empTx,'saida'))}</div></div>
      </div>
      <div class="scope-col">
        <div class="scope-col-title"><span class="dot pessoal"></span> Pessoal</div>
        <div class="mini-card in"><div class="lbl">Entradas</div><div class="val">${fmt(sumBy(pesTx,'entrada'))}</div></div>
        <div class="mini-card out"><div class="lbl">Saídas</div><div class="val">${fmt(sumBy(pesTx,'saida'))}</div></div>
      </div>
    </div>
    <div class="section-title">Últimos lançamentos</div>
    <div class="card">${renderTxList(mt, true, 6)}</div>
    ${renderFlowInsights(mt)}
  `;
}

function renderScope(scope){
  const label = scope==='empresa' ? 'Empresa' : 'Pessoal';
  const mt = monthTx(scope);
  return `
    <div class="head-scope"><div class="h-title ${scope}">${label}</div></div>
    ${monthSwitchHTML()}
    <div class="grid-2">
      <div class="mini-card in"><div class="lbl">Entradas</div><div class="val">${fmt(sumBy(mt,'entrada'))}</div></div>
      <div class="mini-card out"><div class="lbl">Saídas</div><div class="val">${fmt(sumBy(mt,'saida'))}</div></div>
    </div>
    <button class="btn-primary ${scope}" onclick="openTxSheet('${scope}')">+ Novo lançamento</button>
    <div class="section-title">Lançamentos <span class="tag">${mt.length}</span></div>
    <div class="card">${renderTxList(mt, false)}</div>
    ${renderAccountsSection(scope)}
  `;
}

function renderAccountsSection(scope){
  const accounts = state.accounts.filter(a=> scope==='pessoal' ? a.type==='pessoal' : a.type!=='pessoal');
  const label = scope==='empresa' ? 'empresa' : 'pessoal';
  return `
    <div class="section-title">Contas <span class="tag">${accounts.length}</span></div>
    ${accounts.length ? accounts.map(a=>`
      <div class="acc-card">
        ${bankBadgeHTML(a.bankId, 40, a.customBank)}
        <div class="acc-mid">
          <div class="acc-name">${escHtml(a.name)}</div>
          <div class="acc-bal">${bankDisplayName(a)} · ${fmt(accountBalance(a.id))}</div>
        </div>
        <div class="acc-actions">
          <button class="icon-btn" onclick="openAccountSheet('${scope}','${a.id}')" title="Editar">✎</button>
          <button class="icon-btn" onclick="deleteAccount('${a.id}')" title="Excluir">×</button>
        </div>
      </div>`).join('') : `<div class="empty" style="padding:16px 4px">Nenhuma conta ${label} cadastrada ainda.</div>`}
    <button class="add-acc-btn" onclick="openAccountSheet('${scope}')">+ Adicionar conta ${label}</button>
  `;
}

function escHtml(value){ return String(value ?? '').replace(/[&<>'"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
function recurringFor(scope){ return state.recurring.filter(r=>r.scope===scope); }
function recurringTotal(scope, type){ return recurringFor(scope).filter(r=>r.type===type).reduce((s,r)=>s+Number(r.amount||0),0); }

function renderRecurringItems(scope){
  const items = recurringFor(scope).sort((a,b)=>(Number(a.dueDay)||99)-(Number(b.dueDay)||99));
  if(!items.length) return '<div class="fixed-empty">Nenhuma conta fixa cadastrada.</div>';

/* ===== Painel de gráficos (SVG nativo, sem dependências externas) ===== */
const CHART_PALETTE = ['#0A8754','#2ECC71','#0BA5A4','#3B82C4','#8E44AD','#E67E22','#F1C40F','#16A085','#EC407A','#6C757D'];
function polarToCartesian(cx, cy, r, angleDeg){
  const rad = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}
function svgDonut(data){
  const size = 130;
  const total = data.reduce((s,d)=>s+d.value,0);
  const r = size/2 - 6, cx = size/2, cy = size/2, thickness = r*0.42;
  let paths = '';
  if(!total){
    paths = `<circle cx="${cx}" cy="${cy}" r="${r-thickness/2}" fill="none" stroke="#EEF2F6" stroke-width="${thickness}"></circle>`;
  } else {
    let angleStart = 0;
    data.forEach(d=>{
      const angle = (d.value/total) * 360;
      if(angle <= 0) return;
      const angleEnd = Math.min(angleStart + angle, 359.99);
      const largeArc = angle > 180 ? 1 : 0;
      const p1 = polarToCartesian(cx,cy,r,angleStart);
      const p2 = polarToCartesian(cx,cy,r,angleEnd);
      const p3 = polarToCartesian(cx,cy,r-thickness,angleEnd);
      const p4 = polarToCartesian(cx,cy,r-thickness,angleStart);
      paths += `<path d="M ${p1.x} ${p1.y} A ${r} ${r} 0 ${largeArc} 1 ${p2.x} ${p2.y} L ${p3.x} ${p3.y} A ${r-thickness} ${r-thickness} 0 ${largeArc} 0 ${p4.x} ${p4.y} Z" fill="${d.color}"></path>`;
      angleStart += angle;
    });
  }
  return `<svg viewBox="0 0 ${size} ${size}" style="width:100%; max-width:150px; height:auto; display:block; margin:0 auto;">${paths}</svg>`;
}
function donutLegendHTML(data){
  if(!data.length) return '<div class="empty" style="padding:8px 0">Sem dados neste período.</div>';
  return data.map(d=>`<div style="display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--paper); margin-bottom:5px;">
    <span style="width:8px; height:8px; border-radius:2px; background:${d.color}; display:inline-block; flex-shrink:0;"></span>
    <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escHtml(d.label)}</span>
    <span style="color:var(--muted); font-weight:600; flex-shrink:0;">${fmt(d.value)}</span>
  </div>`).join('');
}
function lastNMonths(n){
  const arr = []; let y = state.month.y, m = state.month.m;
  for(let i=n-1;i>=0;i--){ let yy=y, mm=m-i; while(mm<0){ mm+=12; yy--; } arr.push({y:yy, m:mm}); }
  return arr;
}
function svgBarCompare(monthsData){
  const w = 300, h = 170, padBottom = 22, padTop = 12, padSide = 6;
  const maxVal = Math.max(1, ...monthsData.flatMap(d=>[d.entradas, d.saidas]));
  const groupW = (w - padSide*2) / monthsData.length;
  const barW = Math.max(4, groupW/2 - 5);
  const usableH = h - padBottom - padTop;
  let bars = '';
  monthsData.forEach((d,i)=>{
    const gx = padSide + i*groupW;
    const hEnt = (d.entradas/maxVal) * usableH;
    const hSai = (d.saidas/maxVal) * usableH;
    bars += `<rect x="${gx + groupW/2 - barW - 2}" y="${h-padBottom-hEnt}" width="${barW}" height="${hEnt}" rx="3" fill="#0A8754"></rect>`;
    bars += `<rect x="${gx + groupW/2 + 2}" y="${h-padBottom-hSai}" width="${barW}" height="${hSai}" rx="3" fill="#E53935"></rect>`;
    bars += `<text x="${gx + groupW/2}" y="${h-7}" font-size="9" fill="#6C757D" text-anchor="middle" font-family="Inter,sans-serif">${escHtml(d.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; display:block;">${bars}</svg>`;
}
function renderPanel(scope){
  const months = lastNMonths(6);
  const monthsData = months.map(({y,m})=>{
    const list = state.transactions.filter(t => (!scope || t.scope===scope) && txInMonth(t,y,m));
    return { label: MONTHS[m].slice(0,3), entradas: sumBy(list,'entrada'), saidas: sumBy(list,'saida') };
  });
  const mt = monthTx().filter(t=>!scope || t.scope===scope);

    const source = mt.find(t=>t.category===key && t.type===type);
    return { label: catLabel(source ? source.scope : (scope || 'empresa'), type, key), value: val, color: CHART_PALETTE[i%CHART_PALETTE.length] };
  });
  const entData = toChartData(entCats,'entrada');
  const saiData = toChartData(saiCats,'saida');
  return `
    <div class="section-title" style="margin-top:0">Painel — evolução (6 meses)</div>
    <div class="card">
      ${svgBarCompare(monthsData)}

        <span style="display:flex; align-items:center; gap:5px;"><span style="width:9px; height:9px; border-radius:2px; background:#0A8754; display:inline-block;"></span>Entradas</span>

      <div class="card"><h4 style="font-size:12px; margin:0 0 10px; font-weight:700; color:var(--paper);">Entradas por categoria</h4>${svgDonut(entData)}<div style="margin-top:10px;">${donutLegendHTML(entData)}</div></div>
      <div class="card"><h4 style="font-size:12px; margin:0 0 10px; font-weight:700; color:var(--paper);">Saídas por categoria</h4>${svgDonut(saiData)}<div style="margin-top:10px;">${donutLegendHTML(saiData)}</div></div>
    </div>
  `;
}

function reportCategories(list, type){
  const totals = {};
  list.filter(t=>t.type===type).forEach(t=>{
    const key = t.category || 'outro';
    totals[key] = (totals[key] || 0) + Number(t.amount || 0);
  });
  return Object.entries(totals).sort((a,b)=>b[1]-a[1]);
}

function reportRows(list, scope, type){
  const rows = reportCategories(list.filter(t=>!scope || t.scope===scope), type);

    const source = list.find(t=>t.category===key && t.type===type);
    const label = catLabel(source ? source.scope : (scope || 'empresa'), type, key);

      <div class="bar-wrap"><div class="bar" style="width:${Math.max(4, amount/max*100)}%"></div></div>

}

/* ===== Importação de extrato (OFX / CSV) ===== */
function guessCategory(scope, type, text){
  const t = (text||'').toLowerCase();
  const rules = {
    empresa: {
      entrada: [[/adesao|adesão/,'adesao'],[/premia/,'premiacao'],[/comiss/,'comissao'],[/venda/,'vendas'],[/servi[cç]o/,'servicos'],[/cliente|receb/,'recebimento'],[/aporte|s[oó]cio/,'aporte']],
      saida: [[/invest/,'investimento'],[/an[uú]ncio|\bads\b|facebook|google ads|instagram/,'anuncios'],[/aluguel|condom[ií]nio/,'aluguel'],[/folha|sal[aá]rio.*func|pagamento.*func/,'folha'],[/fornecedor/,'fornecedores'],[/imposto|darf|\bdas\b|inss|fgts|\btaxa\b/,'impostos'],[/equipamento|notebook|computador/,'equipamentos'],[/software|assinatura|saas|licen[cç]a/,'software'],[/uber|99app|combust[ií]vel|transporte|estacionamento/,'transporte_empresa'],[/consultoria|terceiriz/,'servicos_terceiros'],[/tarifa|manuten[cç][aã]o.*conta/,'tarifas']]
    },
    pessoal: {
      entrada: [[/pr[oó].?labore/,'prolabore'],[/sal[aá]rio/,'salario'],[/empr[eé]stimo/,'emprestimo'],[/presente|ajuda/,'presente'],[/rendimento|dividendo|\bjuros\b/,'rendimento'],[/reembolso/,'reembolso']],
      saida: [[/aluguel|condom[ií]nio|financiamento.*(casa|imovel|imóvel)|\biptu\b/,'moradia'],[/restaurante|ifood|lanche|padaria/,'alimentacao'],[/supermercado|\bmercado\b|hortifruti/,'supermercado'],[/uber|99app|combust[ií]vel|transporte|estacionamento|[oô]nibus/,'transporte'],[/farm[aá]cia|hospital|m[eé]dic|plano de sa[uú]de|dentista/,'saude'],[/escola|faculdade|\bcurso\b|mensalidade/,'educacao'],[/cinema|streaming|netflix|spotify|\bshow\b|viagem/,'lazer'],[/\bfilho\b|creche|escola infantil/,'familia'],[/\bloja\b|roupa|cal[cç]ado/,'vestuario'],[/energia|\b[aá]gua\b|internet|telefone|assinatura/,'contas'],[/empr[eé]stimo/,'emprestimo_pagamento'],[/cart[aã]o de cr[eé]dito|\bfatura\b/,'cartao']]
    }
  };
  const list = (rules[scope] && rules[scope][type]) || [];
  for(const [re,key] of list){ if(re.test(t)) return key; }
  return type==='entrada' ? 'outras_entradas' : 'outras_saidas';
}
function parseBRDate(str){
  if(!str) return '';
  str = String(str).trim();
  let m = str.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = str.match(/^(\d{4})(\d{2})(\d{2})/); if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){ let [,d,mo,y] = m; if(y.length===2) y = (Number(y)>50?'19':'20')+y; return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`; }
  return '';
}
function parseAmountStr(str){
  if(str===undefined||str===null) return NaN;
  let s = String(str).trim(); if(!s) return NaN;
  let neg = false;
  if(/^\(.*\)$/.test(s)){ neg = true; s = s.slice(1,-1); }
  s = s.replace(/R\$\s?/i,'').replace(/\s/g,'');
  if(s.startsWith('-')){ neg = true; s = s.slice(1); } else if(s.startsWith('+')){ s = s.slice(1); }
  if(s.includes(',') && s.includes('.')){
    if(s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g,'').replace(',','.');
    else s = s.replace(/,/g,'');
  } else if(s.includes(',')){ s = s.replace(',', '.'); }
  const n = parseFloat(s);
  if(isNaN(n)) return NaN;
  return neg ? -n : n;
}
// Alguns extratos exportados vêm com acentuação corrompida (UTF-8 lido como Latin-1 e regravado),
// ex.: "HistÃ³rico" em vez de "Histórico", ou "ï»¿" no início do arquivo. Detecta e corrige isso.
function fixMojibake(text){
  if(!/Ã[-¿]|ï»¿/.test(text)) return text;
  try{
    const bytes = new Uint8Array(text.length);
    for(let i=0;i<text.length;i++){ const code = text.charCodeAt(i); bytes[i] = code < 256 ? code : 63; }
    const fixed = new TextDecoder('utf-8', {fatal:false}).decode(bytes);
    return fixed && fixed.indexOf('�') === -1 ? fixed : text;
  }catch(e){ return text; }
}
function parseOFX(text){
  text = fixMojibake(text);
  const rows = [];
  const blocks = text.match(/<STMTTRN>[\s\S]*?(?:<\/STMTTRN>|(?=<STMTTRN>)|(?=<\/BANKTRANLIST>))/gi) || [];
  blocks.forEach(block=>{
    const get = (tag)=>{ const m = block.match(new RegExp('<'+tag+'>([^<\\r\\n]*)','i')); return m ? m[1].trim() : ''; };
    const date = parseBRDate(get('DTPOSTED'));
    const amount = parseAmountStr(get('TRNAMT'));
    const name = get('NAME'), memo = get('MEMO'), payee = get('PAYEE');
    let desc = name || payee || memo || 'Transação importada';
    if(memo && desc !== memo) desc += ' - ' + memo;
    if(date && !isNaN(amount) && amount !== 0) rows.push({date, description: desc, amount});
  });
  return rows;
}
function detectDelimiter(line){
  // Extratos brasileiros usam vírgula como separador decimal (ex.: "150,00"), então contar
  // vírgulas para decidir o delimitador confunde valor com coluna. Preferimos ";" sempre que
  // ele aparecer, e só usamos "," como delimitador quando não há ";" nem tab na linha.
  const semicolonCount = (line.match(/;/g)||[]).length;
  const tabCount = (line.match(/\t/g)||[]).length;
  const commaCount = (line.match(/,/g)||[]).length;
  if(semicolonCount > 0 && semicolonCount >= tabCount) return ';';
  if(tabCount > 0) return '\t';
  return commaCount > 0 ? ',' : ';';
}
function splitCSVLine(line, delim){
  const result = []; let cur='', inQuotes=false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(ch === '"'){ inQuotes = !inQuotes; continue; }
    if(ch === delim && !inQuotes){ result.push(cur); cur=''; continue; }
    cur += ch;
  }
  result.push(cur);
  return result.map(s=>s.trim());
}
// Procura a linha de cabeçalho de verdade em vez de assumir que é a primeira linha do arquivo —
// extratos exportados costumam ter uma linha de título antes (ex.: "Extrato de: Ag: ... | Conta: ...").
// Remove acentos antes de comparar cabeçalhos — "histórico".includes("histor") é FALSE em JS
// por causa do "ó" acentuado, então sem isso várias colunas reais passavam batido.
function normalizeForMatch(s){
  return String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}
function findCSVHeaderRow(lines, delim){
  const limit = Math.min(lines.length, 15);
  for(let i=0;i<limit;i++){
    const cols = splitCSVLine(lines[i], delim).map(normalizeForMatch);
    const hasDate = cols.some(c=>c.includes('data')||c.includes('date'));
    const hasDesc = cols.some(c=>c.includes('histor')||c.includes('descri')||c.includes('memo')||c.includes('detalhe')||c.includes('lancamento'));
    const hasValueCol = cols.some(c=>c.includes('valor')||c.includes('amount')||c.includes('montante')||c.includes('credito')||c.includes('debito'));
    if(hasDate && hasDesc && hasValueCol) return i;
  }
  return -1;
}
function parseCSV(text){
  text = fixMojibake(text);
  const lines = text.split(/\r\n|\n|\r/).filter(l=>l.trim().length);
  if(!lines.length) return [];
  let delim = detectDelimiter(lines[0]);
  let headerRowIdx = findCSVHeaderRow(lines, delim);
  if(headerRowIdx < 0){
    // a 1ª linha pode não ser representativa do delimitador real quando há uma linha de título antes do cabeçalho
    delim = detectDelimiter(lines.slice(0, Math.min(lines.length,5)).join('\n'));
    headerRowIdx = findCSVHeaderRow(lines, delim);
  }
  const header = headerRowIdx>=0 ? splitCSVLine(lines[headerRowIdx], delim).map(normalizeForMatch) : [];
  // documento/número de referência nunca deve ser confundido com data, descrição ou valor
  const docCols = header.map((h,idx)=> (h.includes('documento') || h.includes('docto') || h.includes('núm') || h.includes('num.') || h.includes('referência') || h.includes('referencia')) ? idx : -1).filter(idx=>idx>=0);
  const findCol = (patterns, exclude=[])=> header.findIndex((h,idx)=> !exclude.includes(idx) && !docCols.includes(idx) && patterns.some(p=>h.includes(p)));
  let dateIdx, descIdx, amountIdx, debitIdx, creditIdx, startRow;
  if(headerRowIdx >= 0){
    dateIdx = findCol(['data','date']);
    descIdx = findCol(['histor','descri','memo','lancamento','lançamento','detalhe'], [dateIdx]);
    amountIdx = findCol(['valor','amount','montante']);
    debitIdx = findCol(['debito','débito','saida','saída']);
    creditIdx = findCol(['credito','crédito','entrada']);
    startRow = headerRowIdx + 1;
  } else {
    // nenhum cabeçalho reconhecível: assume a ordem mais comum (data, descrição, valor) a partir da 1ª linha
    dateIdx = 0; descIdx = 1; amountIdx = 2; debitIdx = -1; creditIdx = -1; startRow = 0;
  }
  const rows = [];
  for(let i=startRow;i<lines.length;i++){
    const cols = splitCSVLine(lines[i], delim);
    if(cols.length<2) continue;
    const date = parseBRDate(dateIdx>=0 ? cols[dateIdx] : '');
    const description = descIdx>=0 ? cols[descIdx] : cols.filter((_,idx)=>idx!==dateIdx && idx!==amountIdx).join(' ');
    let amount;
    if(amountIdx>=0){ amount = parseAmountStr(cols[amountIdx]); }
    else{
      const c = creditIdx>=0 ? parseAmountStr(cols[creditIdx]) : NaN;
      const d = debitIdx>=0 ? parseAmountStr(cols[debitIdx]) : NaN;
      if(!isNaN(c) && c!==0) amount = Math.abs(c); else if(!isNaN(d) && d!==0) amount = -Math.abs(d);
    }
    if(date && amount!==undefined && !isNaN(amount) && amount !== 0) rows.push({date, description: description || 'Transação importada', amount});
  }
  return rows;
}

/* ===== Leitura de extrato em Excel/.xlsx (via SheetJS, carregado sob demanda) ===== */
const XLSXJS_VERSION = '0.18.5';
let xlsxLoadPromise = null;
function ensureXlsxLoaded(){
  if(window.XLSX) return Promise.resolve();
  if(xlsxLoadPromise) return xlsxLoadPromise;
  xlsxLoadPromise = new Promise((resolve, reject)=>{
    const script = document.createElement('script');
    script.src = `https://cdnjs.cloudflare.com/ajax/libs/xlsx/${XLSXJS_VERSION}/xlsx.full.min.js`;
    script.onload = () => {
      if(window.XLSX) resolve();
      else { xlsxLoadPromise = null; reject(new Error('Leitor de planilha indisponível.')); }
    };
    script.onerror = () => { xlsxLoadPromise = null; reject(new Error('Não foi possível carregar o leitor de planilha. Verifique sua internet.')); };
    document.head.appendChild(script);
  });
  return xlsxLoadPromise;
}
function extractXLSXRows(arrayBuffer){
  const wb = window.XLSX.read(arrayBuffer, { type: 'array' });
  let allRows = [];
  wb.SheetNames.forEach(name=>{
    const rows = window.XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: null, raw: false });
    // Algumas planilhas (geradas por conversores automáticos) trazem texto com acentuação
    // corrompida (ex.: "HistÃ³rico"), do mesmo jeito que acontece em CSV — corrige célula a célula.
    const fixedRows = rows.map(row => (row||[]).map(cell => typeof cell === 'string' ? fixMojibake(cell) : cell));
    allRows = allRows.concat(fixedRows);
  });
  return allRows;
}
// Extratos em .xlsx costumam ter linhas de título/dados da empresa antes da tabela real —
// por isso procuramos a linha de cabeçalho em vez de assumir que é a primeira linha.
function findXLSXHeaderRow(rows){
  for(let i=0;i<rows.length;i++){
    const row = (rows[i]||[]).map(normalizeForMatch);
    const hasDate = row.some(c=>c.includes('data'));
    const hasValue = row.some(c=>c.includes('valor')||c.includes('credito')||c.includes('debito'));
    const hasDesc = row.some(c=>c.includes('descri') || c.includes('histor'));
    if(hasDate && hasValue && hasDesc) return i;
  }
  return -1;
}
function parseXLSXStatement(rows){
  const headerIdx = findXLSXHeaderRow(rows);
  if(headerIdx < 0) return [];
  const header = (rows[headerIdx]||[]).map(normalizeForMatch);
  const findCol = (patterns)=> header.findIndex(h=>patterns.some(p=>h.includes(p)));
  const dateIdx = findCol(['data']);
  const descIdx = findCol(['descri','histor']);
  const valorIdx = findCol(['valor']);
  const tipoIdx = findCol(['tipo']);
  const debitIdx = tipoIdx>=0 ? -1 : findCol(['debito']);
  const creditIdx = tipoIdx>=0 ? -1 : findCol(['credito']);
  const out = [];
  for(let i=headerIdx+1;i<rows.length;i++){
    const row = rows[i];
    if(!row || dateIdx<0 || row[dateIdx]==null || String(row[dateIdx]).trim()==='') continue; // pula "Saldo do Dia", rodapé etc.
    const date = parseBRDate(String(row[dateIdx]));
    if(!date) continue;
    let amount;
    if(valorIdx>=0 && row[valorIdx]!=null && String(row[valorIdx]).trim()!==''){
      amount = parseAmountStr(row[valorIdx]);
    } else if(debitIdx>=0 || creditIdx>=0){
      const c = creditIdx>=0 && row[creditIdx]!=null ? parseAmountStr(row[creditIdx]) : NaN;
      const d = debitIdx>=0 && row[debitIdx]!=null ? parseAmountStr(row[debitIdx]) : NaN;
      if(!isNaN(c) && c!==0) amount = Math.abs(c); else if(!isNaN(d) && d!==0) amount = -Math.abs(d);
    }
    if(amount===undefined || isNaN(amount) || amount===0) continue;
    // a coluna "Tipo" (Débito/Crédito), quando existe, é a referência mais confiável de sinal
    if(tipoIdx>=0 && row[tipoIdx]){
      const tipo = String(row[tipoIdx]).toLowerCase();
      if(tipo.includes('déb') || tipo.includes('deb')) amount = -Math.abs(amount);
      else if(tipo.includes('créd') || tipo.includes('cred')) amount = Math.abs(amount);
    }
    const description = descIdx>=0 && row[descIdx]!=null && String(row[descIdx]).trim()!=='' ? String(row[descIdx]).trim() : 'Transação importada';
    out.push({ date, description, amount });
  }
  return out;
}

/* ===== Leitura de extrato em PDF (via PDF.js, carregado sob demanda) ===== */
const PDFJS_VERSION = '3.11.174';
let pdfJsLoadPromise = null;
function ensurePdfJsLoaded(){
  if(window.pdfjsLib) return Promise.resolve();
  if(pdfJsLoadPromise) return pdfJsLoadPromise;
  pdfJsLoadPromise = new Promise((resolve, reject)=>{
    const script = document.createElement('script');
    script.src = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/pdf.min.js`;
    script.onload = () => {
      if(window.pdfjsLib){
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/pdf.worker.min.js`;
        resolve();
      } else {
        pdfJsLoadPromise = null;
        reject(new Error('Leitor de PDF indisponível.'));
      }
    };
    script.onerror = () => { pdfJsLoadPromise = null; reject(new Error('Não foi possível carregar o leitor de PDF. Verifique sua internet.')); };
    document.head.appendChild(script);
  });
  return pdfJsLoadPromise;
}
// Agrupa os itens de texto de uma página (cada um com posição x/y) em linhas,
// já que o PDF não guarda quebras de linha — reconstruímos pela proximidade vertical.
function groupTextItemsIntoLines(items){
  const sorted = items.slice().sort((a,b)=> b.y - a.y || a.x - b.x);
  const lines = []; let curY = null, curLine = [];
  const yTol = 2.5;
  sorted.forEach(it=>{
    if(curY===null || Math.abs(it.y-curY) > yTol){
      if(curLine.length) lines.push(curLine.map(w=>w.str).join(' '));
      curLine = [it]; curY = it.y;
    } else { curLine.push(it); }
  });
  if(curLine.length) lines.push(curLine.map(w=>w.str).join(' '));
  return lines;
}
async function extractPDFText(typedArray){
  const pdf = await window.pdfjsLib.getDocument({ data: typedArray }).promise;
  let fullText = '';
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const items = content.items.map(it=>({ str: it.str, x: it.transform[4], y: it.transform[5] }));
    fullText += groupTextItemsIntoLines(items).join('\n') + '\n';
  }
  return fullText;
}
// Extração heurística: procura linhas que comecem com uma data e contenham valor(es) monetário(s).
// Extratos em PDF variam muito de layout — por isso cada lançamento extraído vem para revisão manual.
function parsePDFStatement(text){
  text = fixMojibake(text);
  const lines = text.split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const dateRe = /^(\d{2}\/\d{2}\/\d{4}|\d{2}\/\d{2}\/\d{2})\b\s*/;
  const moneyRe = /-?R?\$?\s?\d{1,3}(?:\.\d{3})*,\d{2}\s?-?/g;
  const rows = [];
  lines.forEach(line=>{
    const dm = line.match(dateRe);
    if(!dm) return;
    const rest = line.slice(dm[0].length);
    const moneyMatches = rest.match(moneyRe);
    if(!moneyMatches || !moneyMatches.length) return;
    // quando há 2+ valores na linha, assume-se o padrão "valor da transação" seguido de "saldo"
    const chosenIdx = moneyMatches.length >= 2 ? moneyMatches.length - 2 : 0;
    const amtRaw = moneyMatches[chosenIdx];
    let amount = parseAmountStr(amtRaw.replace(/-\s*$/,''));
    if(isNaN(amount) || amount === 0) return;
    let uncertain = true;
    if(/-\s*$/.test(amtRaw) || /^\s*-/.test(amtRaw)){
      amount = -Math.abs(amount); uncertain = false;
    } else {
      const idx = rest.lastIndexOf(amtRaw);
      const tail = rest.slice(idx + amtRaw.length, idx + amtRaw.length + 2);
      if(/^\s*D/i.test(tail)){ amount = -Math.abs(amount); uncertain = false; }
      else if(/^\s*C/i.test(tail)){ amount = Math.abs(amount); uncertain = false; }
      else { amount = -Math.abs(amount); } // sem indicação clara: assume saída, mas marca como incerto para revisão
    }
    const firstMoneyPos = rest.indexOf(moneyMatches[0]);
    let description = rest.slice(0, firstMoneyPos).trim().replace(/\s{2,}/g,' ');
    if(!description) description = 'Transação importada';
    const date = parseBRDate(dm[1]);
    if(date) rows.push({ date, description, amount, uncertain });
  });
  return rows;
}

    <div class="field"><label>Conta (opcional)</label><select onchange="importDraft.accountId=this.value">
      <option value="">Sem conta vinculada</option>
      ${accounts.map(a=>`<option value="${a.id}" ${a.id===importDraft.accountId?'selected':''}>${escHtml(a.name)}</option>`).join('')}
    </select></div>
    <div class="field"><label>Arquivo do extrato (.ofx, .csv, .xlsx ou .pdf)</label>
      <input type="file" accept=".ofx,.csv,text/csv,application/x-ofx,.xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,.pdf,application/pdf" onchange="handleImportFile(event)">
    </div>
    <div id="import-file-status" style="font-size:12px;color:var(--muted);margin:-6px 0 4px;"></div>
    <div class="sheet-actions"><button class="btn ghost" onclick="closeSheet()">Cancelar</button></div>
  `;
  openSheetHTML(html);
}
function finishParsedImport(parsed, status){
  if(!parsed.length){ if(status) status.textContent = 'Não foi possível identificar lançamentos neste arquivo. Verifique o formato.'; return; }
  importDraft.rows = parsed.map(r=>{
    const type = r.amount >= 0 ? 'entrada' : 'saida';
    const amount = Math.abs(r.amount);
    const isDup = state.transactions.some(t=> t.scope===importDraft.scope && t.date===r.date && Math.abs(Number(t.amount)-amount)<0.005 && (t.description||'').trim().toLowerCase()===(r.description||'').trim().toLowerCase());
    return { date: r.date, description: r.description, amount, type, category: guessCategory(importDraft.scope, type, r.description), checked: !isDup, dup: isDup, uncertain: !!r.uncertain };
  });
  renderImportPreview();
}
function handleImportFile(evt){
  const file = evt.target.files && evt.target.files[0];
  if(!file) return;
  importDraft.fileName = file.name;
  const status = document.getElementById('import-file-status');
  const isPDF = /\.pdf$/i.test(file.name) || file.type==='application/pdf';
  const isXLSX = /\.xlsx?$/i.test(file.name) || /spreadsheetml|ms-excel/i.test(file.type||'');

  if(isXLSX){
    if(status) status.textContent = 'Carregando leitor de planilha (é necessário internet na primeira vez)...';
    ensureXlsxLoaded().then(()=>{
      if(status) status.textContent = 'Lendo planilha...';
      const reader = new FileReader();
      reader.onload = () => {
        try{
          const rows = extractXLSXRows(reader.result);
          const parsed = parseXLSXStatement(rows);
          if(!parsed.length){
            if(status) status.textContent = 'Não encontramos uma tabela de lançamentos reconhecível nesta planilha (procuramos colunas de Data, Descrição e Valor).';
            return;
          }
          finishParsedImport(parsed, status);
        }catch(e){
          if(status) status.textContent = 'Não foi possível ler esta planilha. Tente exportar como CSV ou OFX.';
        }
      };
      reader.readAsArrayBuffer(file);
    }).catch(err=>{
      if(status) status.textContent = (err && err.message) || 'Não foi possível carregar o leitor de planilha. Verifique sua internet ou use OFX/CSV.';
    });
    return;
  }

  if(isPDF){
    if(status) status.textContent = 'Carregando leitor de PDF (é necessário internet na primeira vez)...';
    ensurePdfJsLoaded().then(()=>{
      if(status) status.textContent = 'Lendo PDF...';
      const reader = new FileReader();
      reader.onload = async () => {
        try{
          const typedArray = new Uint8Array(reader.result);
          const text = await extractPDFText(typedArray);
          if(!text || !text.trim()){
            if(status) status.textContent = 'Não conseguimos extrair texto deste PDF — ele pode ser uma imagem digitalizada. Tente exportar o extrato como OFX ou CSV no app do banco.';
            return;
          }
          const parsed = parsePDFStatement(text);
          finishParsedImport(parsed, status);
        }catch(e){
          if(status) status.textContent = 'Não foi possível ler este PDF (pode estar protegido por senha). Tente outro arquivo ou use OFX/CSV.';
        }
      };
      reader.readAsArrayBuffer(file);
    }).catch(err=>{
      if(status) status.textContent = (err && err.message) || 'Não foi possível carregar o leitor de PDF. Verifique sua internet ou use OFX/CSV.';
    });
    return;
  }

  if(status) status.textContent = 'Lendo arquivo...';
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const text = reader.result;
      const isOFX = /\.ofx$/i.test(file.name) || /<OFX>|OFXHEADER/i.test(text);
      const parsed = isOFX ? parseOFX(text) : parseCSV(text);
      finishParsedImport(parsed, status);
    }catch(e){ if(status) status.textContent = 'Erro ao ler o arquivo. Tente outro formato.'; }
  };
  reader.readAsText(file, 'UTF-8');
}
function renderImportPreview(){
  const rows = importDraft.rows;
  const selectedCount = rows.filter(r=>r.checked).length;
  const dupCount = rows.filter(r=>r.dup).length;
  const html = `
    <h3>Revisar importação — ${importDraft.scope==='empresa'?'Empresa':'Pessoal'}</h3>
    <p class="hint" style="font-size:12px;color:var(--muted);line-height:1.5;margin:-8px 0 12px">
      ${rows.length} lançamento(s) encontrados em <b>${escHtml(importDraft.fileName)}</b>.
      ${dupCount ? `${dupCount} parecem já existir e vieram desmarcados.` : 'Confira categorias e valores antes de confirmar.'}
    </p>
    <div style="max-height:46vh; overflow-y:auto; border:1px solid var(--edge); border-radius:12px; padding:2px 10px;">
      ${rows.map((r,i)=>`
        <div class="fixed-item" style="align-items:flex-start;">
          <input type="checkbox" ${r.checked?'checked':''} onchange="importDraft.rows[${i}].checked=this.checked" style="margin-top:14px; width:16px; height:16px; flex-shrink:0;">
          <div class="fixed-mid">
            <div style="display:flex; gap:6px; margin-bottom:6px;">
              <input type="date" value="${r.date}" onchange="importDraft.rows[${i}].date=this.value" style="flex:1; min-height:36px; padding:6px 8px; font-size:11.5px; border:1px solid var(--edge); border-radius:8px; background:#F9FAFB;">
              <button class="toggle-opt ${r.type==='entrada'?'sel-in':'sel-out'}" style="flex:none; padding:6px 10px; font-size:11px;" onclick="toggleImportRowType(${i})">${r.type==='entrada'?'Entrada':'Saída'}</button>
            </div>
            <input type="text" value="${escHtml(r.description)}" oninput="importDraft.rows[${i}].description=this.value" style="width:100%; min-height:36px; padding:6px 8px; font-size:12px; border:1px solid var(--edge); border-radius:8px; background:#F9FAFB; margin-bottom:6px;">
            <div style="display:flex; gap:6px;">
              <select onchange="importDraft.rows[${i}].category=this.value" style="flex:1; min-height:36px; padding:6px 8px; font-size:11.5px; border:1px solid var(--edge); border-radius:8px; background:#F9FAFB;">
                ${CATS[importDraft.scope][r.type].map(c=>`<option value="${c.k}" ${c.k===r.category?'selected':''}>${c.l}</option>`).join('')}
              </select>
              ${moneyInputHTML({value:r.amount, onInput:`maskMoneyInput(this, v=>importDraft.rows[${i}].amount=v)`, height:36, fontSize:11.5, wrapperStyle:'width:118px; flex-shrink:0;'})}
            </div>
            ${r.dup ? '<div style="font-size:10px;color:var(--danger);margin-top:5px;">Possível duplicado — já existe um lançamento parecido</div>' : ''}
            ${r.uncertain ? '<div style="font-size:10px;color:#B26A00;margin-top:5px;">Não identificamos com certeza se é entrada ou saída neste PDF — confira o tipo acima</div>' : ''}
          </div>
        </div>`).join('')}
    </div>
    <div class="sheet-actions">
      <button class="btn ghost" onclick="renderImportStep1()">Voltar</button>
      <button class="btn save" onclick="confirmImport()">Importar (${selectedCount})</button>
    </div>
  `;
  openSheetHTML(html);
}
function toggleImportRowType(i){
  const r = importDraft.rows[i];
  r.type = r.type==='entrada' ? 'saida' : 'entrada';
  r.category = guessCategory(importDraft.scope, r.type, r.description);
  renderImportPreview();
}
function confirmImport(){
  const toImport = importDraft.rows.filter(r=>r.checked);
  if(!toImport.length){ alert('Selecione ao menos um lançamento para importar.'); return; }
  toImport.forEach(r=>{
    state.transactions.push({
      id: uid(), scope: importDraft.scope, type: r.type, category: r.category,
      amount: Number(r.amount)||0, date: r.date, accountId: importDraft.accountId || '', description: r.description || ''
    });
  });
  saveTransactions();
  const count = toImport.length;
  closeSheet(); render();
  setTimeout(()=>alert(`${count} lançamento(s) importado(s) com sucesso.`), 150);
}

loadAll();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
  }
</script>
</body>
