<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LCS Finanças — Controle Financeiro</title>
<meta name="theme-color" content="#0A8754">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LCS">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#0A8754;
    --brand-dark:#065F3A;
    --brand-light:#E8F5E9;
    --success:#2ECC71;
    --danger:#E53935;
    --danger-light:#FDECEA;
    --slate:#475569;
    --slate-light:#EEF2F6;
    --ink:#F8F9FA;
    --panel:#FFFFFF;
    --panel-2:#F9FAFB;
    --edge: #E0E0E0;
    --edge-strong: #D4D4D4;
    --paper:#1A1D1E;
    --muted:#6C757D;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--ink); color:var(--paper); font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; height:100%; -webkit-font-smoothing:antialiased;}
  #root{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative; background:var(--ink); border-left:1px solid var(--edge); border-right:1px solid var(--edge);}

  .topbar{
    padding: calc(14px + env(safe-area-inset-top)) 18px 14px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    border-bottom:1px solid var(--edge);
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    position: sticky; top: 0; z-index: 20;
  }
  .topbar-left{display:flex; align-items:center; gap:10px; min-width:0;}
  .logo-mark{width:36px; height:36px; flex-shrink:0;}
  .brand-text{display:flex; flex-direction:column; line-height:1.15; min-width:0;}
  .brand-text .b1{font-size:16px; font-weight:800; letter-spacing:-0.02em; color:var(--paper); white-space:nowrap;}
  .brand-text .b1 span{color:var(--muted); font-weight:400;}
  .brand-text .sub{font-size:10.5px; color:var(--muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .topbar-right{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .icon-circle{width:36px; height:36px; border-radius:999px; border:1px solid var(--edge); background:var(--panel-2); display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; flex-shrink:0;}
  .icon-circle svg{width:17px; height:17px; stroke:var(--muted); fill:none; stroke-width:1.8;}

  main#content{flex:1; padding:18px 16px 92px; overflow-y:auto;}
  nav.bottomnav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    display:flex; background:#FFFFFF; border-top:1px solid var(--edge);
    box-shadow:0 -4px 16px rgba(0,0,0,0.05);
    padding:8px 4px calc(6px + env(safe-area-inset-bottom));
    max-width:520px; width:100%; z-index:30;
  }
  .nav-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:var(--muted); font-family:'Inter', sans-serif; font-size:10px; font-weight:400; cursor:pointer; padding:6px 2px 4px; border-radius:10px; position:relative;}
  .nav-btn svg{width:20px; height:20px; stroke:var(--muted); fill:none; stroke-width:1.9;}
  .nav-btn.active{color:var(--brand); font-weight:600; background:var(--brand-light);}
  .nav-btn.active svg{stroke:var(--brand);}
  .nav-btn.active.pessoal-tab{background:var(--slate-light); color:var(--slate);}
  .nav-btn.active.pessoal-tab svg{stroke:var(--slate);}

  .month-switch{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .month-switch .m-label{font-family:'Inter',sans-serif; font-size:19px; font-weight:700; letter-spacing:-0.02em; text-transform:capitalize;}
  .month-switch .m-btns{display:flex; gap:6px;}
  .m-btn{width:34px; height:34px; border-radius:999px; border:1px solid var(--edge); background:var(--panel); color:var(--paper); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px;}

  .card{background:var(--panel); border:1px solid var(--edge); border-radius:16px; padding:16px; box-shadow:0 4px 20px rgba(17,24,39,0.04);}
  .quick-actions{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
  .quick-action{display:flex; align-items:center; gap:10px; padding:13px 14px; border-radius:14px; border:1px solid var(--edge); background:var(--panel); cursor:pointer;}
  .quick-action .qa-icon{width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .quick-action.empresa .qa-icon{background:var(--brand-light); color:var(--brand);}
  .quick-action.pessoal .qa-icon{background:var(--slate-light); color:var(--slate);}
  .quick-action .qa-icon svg{width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.9;}
  .quick-action .qa-label{font-size:12.5px; font-weight:600; color:var(--paper);}
  .quick-action .qa-sub{font-size:10.5px; color:var(--muted);}

  .hero-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .hero-split{padding:16px 15px; border-radius:16px; border:1px solid var(--edge);}
  .hero-split.empresa{background:linear-gradient(135deg, var(--brand), var(--brand-dark)); border:none;}
  .hero-split.empresa .label{color:rgba(255,255,255,0.82);}
  .hero-split.empresa .value{color:#fff;}
  .hero-split.pessoal{background:var(--panel);}
  .hero-split.pessoal .label{color:var(--muted);}
  .hero-split.pessoal .value{color:var(--paper);}
  .hero-split .label{font-size:11px; display:flex; align-items:center; gap:6px; font-weight:600;}
  .hero-split .value{font-family:'Inter',sans-serif; font-size:22px; font-weight:700; margin-top:6px; letter-spacing:-0.02em;}

  .scope-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .scope-col{display:flex; flex-direction:column; gap:8px;}
  .scope-col-title{font-size:12px; font-weight:700; display:flex; align-items:center; gap:6px; color:var(--paper);}

  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .mini-card{padding:13px 14px; border-radius:14px; border:1px solid var(--edge); background:var(--panel);}
  .mini-card.in{background:var(--brand-light); border-color:transparent;}
  .mini-card.out{background:var(--danger-light); border-color:transparent;}
  .mini-card .lbl{font-size:11px; color:var(--muted); margin-bottom:5px; font-weight:600;}
  .mini-card .val{font-family:'Inter',sans-serif; font-size:15px; font-weight:700;}
  .mini-card.in .val{color:var(--brand-dark);}
  .mini-card.out .val{color:var(--danger);}

  .section-title{font-family:'Inter',sans-serif; font-size:16px; font-weight:700; margin:24px 0 10px; display:flex; align-items:center; justify-content:space-between; color:var(--paper);}
  .section-title .tag{font-size:11px; color:var(--brand); font-weight:600;}

  .dot{width:7px; height:7px; border-radius:999px; display:inline-block;}
  .dot.empresa{background:var(--brand);}
  .dot.pessoal{background:var(--slate);}

  .cat-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--edge);}
  .cat-row:last-child{border-bottom:none;}
  .cat-row .cname{flex:1; font-size:13px; color:var(--paper);}
  .cat-row .cbar-wrap{flex:1; height:6px; border-radius:4px; background:var(--panel-2); overflow:hidden; margin:0 10px;}
  .cat-row .cbar{height:100%; border-radius:4px;}
  .cat-row .camt{font-family:'Inter',sans-serif; font-size:12px; font-weight:600; min-width:78px; text-align:right;}

  .empty{text-align:center; padding:34px 12px; color:var(--muted); font-size:13px; line-height:1.6;}

  .report-summary{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .report-card{padding:14px; border-radius:14px; border:1px solid var(--edge); background:var(--panel);}
  .report-card .lbl{font-size:11px; color:var(--muted); margin-bottom:5px; font-weight:600;}
  .report-card .val{font-size:17px; font-weight:700;}
  .report-card.in .val{color:var(--brand-dark);}
  .report-card.out .val{color:var(--danger);}
  .report-card.balance .val{color:var(--slate);}
  .report-card.total .val{color:var(--paper);}
  .report-scope{margin-bottom:14px;}
  .report-scope-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; font-size:13px; font-weight:700;}
  .report-scope-head .total{font-size:12px; color:var(--muted); font-weight:600;}
  .report-row{display:flex; align-items:center; gap:9px; padding:10px 0; border-bottom:1px solid var(--edge);}
  .report-row:last-child{border-bottom:none;}
  .report-row .name{width:108px; flex-shrink:0; font-size:12px; color:var(--paper); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .report-row .bar-wrap{flex:1; height:7px; border-radius:5px; background:var(--panel-2); overflow:hidden;}
  .report-row .bar{height:100%; border-radius:5px; background:var(--brand);}
  .report-row.out .bar{background:var(--danger);}
  .report-row .amount{min-width:78px; text-align:right; font-size:11.5px; font-weight:700;}
  .report-row.out .amount{color:var(--danger);}
  .report-row.in .amount{color:var(--brand-dark);}
  .flow-card{margin-top:14px;}
  .flow-card h4{font-size:13px; margin:0 0 6px; font-weight:700; color:var(--paper);}
  .flow-card .hint{font-size:11px; color:var(--muted); margin:0 0 9px; line-height:1.4;}
  .flow-row{display:grid; grid-template-columns:102px 1fr 78px; gap:8px; align-items:center; padding:9px 0; border-bottom:1px solid var(--edge);}
  .flow-row:last-child{border-bottom:none;}
  .flow-name{font-size:11.5px; color:var(--paper); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .flow-name small{display:block; color:var(--muted); font-size:9.5px; margin-top:2px;}
  .flow-bar{height:8px; border-radius:5px; background:var(--panel-2); overflow:hidden;}
  .flow-bar i{display:block; height:100%; border-radius:5px;}
  .flow-bar.in i{background:var(--brand);}
  .flow-bar.out i{background:var(--danger);}
  .flow-value{text-align:right; font-size:11px; font-weight:700; white-space:nowrap;}
  .flow-value.in{color:var(--brand-dark);}
  .flow-value.out{color:var(--danger);}
  .tips-card{margin-top:14px; background:linear-gradient(135deg,#F5FAF7,#FFFFFF);}
  .tip{display:flex; gap:9px; padding:9px 0; border-bottom:1px solid var(--edge); font-size:11.5px; line-height:1.45; color:var(--paper);}
  .tip:last-child{border-bottom:none; padding-bottom:0;}
  .tip:first-child{padding-top:0;}
  .tip-mark{width:22px; height:22px; flex-shrink:0; border-radius:7px; background:var(--brand-light); color:var(--brand-dark); display:flex; align-items:center; justify-content:center; font-weight:800;}
  .report-filter{display:flex; gap:8px; margin:-2px 0 14px;}
  .report-filter button{flex:1; padding:9px 6px; border-radius:10px; border:1px solid var(--edge); background:var(--panel); color:var(--muted); font-size:11px; font-weight:700; cursor:pointer;}
  .report-filter button.active{background:var(--brand-light); border-color:var(--brand); color:var(--brand-dark);}
  .pdf-actions{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px;}
  .pdf-btn{padding:11px 8px; border:0; border-radius:11px; color:#fff; font-size:11px; font-weight:700; cursor:pointer;}
  .pdf-btn.empresa{background:linear-gradient(135deg, var(--brand), var(--brand-dark));}
  .pdf-btn.pessoal{background:var(--slate);}

  .tx-item{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--edge); cursor:pointer;}
  .tx-item:last-child{border-bottom:none;}
  .tx-icon{width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;}
  .tx-mid{flex:1; min-width:0;}
  .tx-cat{font-size:13.5px; font-weight:600; color:var(--paper);}
  .tx-meta{font-size:11.5px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tx-amt{font-family:'Inter',sans-serif; font-size:13.5px; font-weight:700; white-space:nowrap;}
  .tx-amt.in{color:var(--brand-dark);}
  .tx-amt.out{color:var(--danger);}

  .btn-primary{width:100%; padding:14px; border-radius:12px; border:none; font-family:'Inter', sans-serif; font-weight:700; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;}
  .btn-primary.empresa{background:linear-gradient(135deg, var(--brand), var(--brand-dark)); color:#fff;}
  .btn-primary.pessoal{background:var(--slate); color:#fff;}

  .head-scope{margin-bottom:4px;}
  .head-scope .h-title{font-family:'Inter',sans-serif; font-size:23px; font-weight:800; letter-spacing:-0.02em;}
  .head-scope .h-title.empresa{color:var(--brand-dark);}
  .head-scope .h-title.pessoal{color:var(--slate);}

  .acc-card{display:flex; align-items:center; gap:12px; padding:13px; border-radius:14px; border:1px solid var(--edge); background:var(--panel); margin-bottom:10px;}
  .acc-mid{flex:1; min-width:0;}
  .acc-name{font-size:14px; font-weight:600; color:var(--paper);}
  .acc-bal{font-family:'Inter',sans-serif; font-size:13px; color:var(--muted); margin-top:2px; font-weight:600;}
  .acc-actions{display:flex; gap:6px;}
  .icon-btn{width:32px; height:32px; border-radius:9px; border:1px solid var(--edge); background:var(--panel-2); color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer;}

  .add-acc-btn{width:100%; padding:13px; border-radius:12px; border:1.5px dashed var(--edge-strong); background:transparent; color:var(--brand-dark); font-weight:700; font-size:13.5px; cursor:pointer; margin-top:6px;}

  .overlay{position:fixed; inset:0; background:rgba(17,24,39,0.5); backdrop-filter: blur(4px); display:none; align-items:flex-end; justify-content:center; z-index:50;}
  .overlay.show{display:flex;}
  .sheet{width:100%; max-width:520px; background:var(--panel); border-radius:22px 22px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;}
  .sheet-handle{width:36px; height:4px; background:var(--edge-strong); border-radius:99px; margin:0 auto 14px;}
  .sheet h3{font-family:'Inter',sans-serif; font-size:18px; margin:0 0 16px; font-weight:700; color:var(--paper);}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11.5px; color:var(--muted); margin-bottom:6px; font-weight:600;}
  .field input, .field select{width:100%; min-height:48px; padding:11px 12px; background:#F9FAFB; border:1px solid var(--edge); border-radius:12px; color:var(--paper); font-family:'Inter', sans-serif; font-size:14px; outline:none;}

  .toggle-row{display:flex; gap:8px; margin-bottom:14px;}
  .toggle-opt{flex:1; text-align:center; padding:12px; border-radius:12px; border:1px solid var(--edge); font-size:13px; font-weight:700; cursor:pointer; color:var(--muted); background:var(--panel-2);}
  .toggle-opt.sel-in{background:var(--brand-light); border-color:var(--brand); color:var(--brand-dark);}
  .toggle-opt.sel-out{background:var(--danger-light); border-color:var(--danger); color:var(--danger);}
  .toggle-opt.sel-pessoal{background:var(--slate-light); border-color:var(--slate); color:var(--slate);}

  .logo-pick{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .logo-preview{width:52px; height:52px; border-radius:14px; background:var(--panel-2); border:1px solid var(--edge); display:flex; align-items:center; justify-content:center; overflow:hidden; font-family:'Inter',sans-serif; font-size:17px; font-weight:700; color:var(--paper);}
  .logo-preview img{width:100%; height:100%; object-fit:cover;}
  .upload-btn{padding:10px 14px; border-radius:10px; border:1px solid var(--edge); background:var(--panel-2); color:var(--paper); font-size:12.5px; font-weight:700; cursor:pointer;}

  .sheet-actions{display:flex; gap:10px; margin-top:16px;}
  .btn{flex:1; padding:14px; border-radius:12px; border:none; font-weight:700; font-size:14px; cursor:pointer;}
  .btn.save{background:linear-gradient(135deg, var(--brand), var(--brand-dark)); color:#fff;}
  .btn.danger{background:var(--danger-light); color:var(--danger);}
  .btn.ghost{background:transparent; color:var(--muted); border:1px solid var(--edge);}

  .hide-balances .val, .hide-balances .value, .hide-balances .acc-bal,
  .hide-balances .tx-amt, .hide-balances .camt, .hide-balances .line b{
    filter: blur(7px); user-select:none;
  }
</style>
</head>
<body>
<div id="root">
  <header class="topbar">
    <div class="topbar-left">
      <img class="logo-mark" src="icon-192.png" alt="Logo LCS Finanças">
      <div class="brand-text">
        <div class="b1">LCS <span>Finanças</span></div>
        <div class="sub">empresa &amp; pessoal</div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="icon-circle" id="eyeToggle" onclick="toggleBalances()">
        <svg viewBox="0 0 24 24" id="eyeIcon"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </header>

  <main id="content"></main>

  <nav class="bottomnav">
    <button class="nav-btn" data-tab="dashboard" onclick="setTab('dashboard')">
      <svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8"/><path d="M5 10v9h14v-9"/></svg>
      Início
    </button>
    <button class="nav-btn pessoal-tab" data-tab="pessoal" onclick="setTab('pessoal')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>
      Pessoal
    </button>
    <button class="nav-btn" data-tab="empresa" onclick="setTab('empresa')">
      <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="1"/><path d="M8 8V6a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
      Empresa
    </button>
    <button class="nav-btn" data-tab="fixas" onclick="setTab('fixas')">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      Fixas
    </button>
    <button class="nav-btn" data-tab="relatorios" onclick="setTab('relatorios')">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M11 20V4M18 20v-7"/></svg>
      Relatórios
    </button>
  </nav>
</div>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<script>
const StorageProvider = {
  async get(key) {
    const val = localStorage.getItem(key);
    return val ? { value: val } : null;
  },
  async set(key, value) {
    localStorage.setItem(key, value);
  }
};

const CATS = {
  empresa: {
    entrada: [{k:'adesao', l:'Adesão'},{k:'premiacao', l:'Premiação'},{k:'comissao', l:'Comissão'},{k:'vendas', l:'Vendas'},{k:'servicos', l:'Prestação de serviços'},{k:'recebimento', l:'Recebimento de cliente'},{k:'aporte', l:'Aporte dos sócios'},{k:'outras_entradas', l:'Outras entradas'}],
    saida: [{k:'investimento', l:'Investimentos'},{k:'anuncios', l:'Anúncios e publicidade'},{k:'aluguel', l:'Aluguel / estrutura'},{k:'folha', l:'Folha de pagamento'},{k:'fornecedores', l:'Fornecedores'},{k:'impostos', l:'Impostos e taxas'},{k:'equipamentos', l:'Equipamentos'},{k:'software', l:'Software e ferramentas'},{k:'transporte_empresa', l:'Transporte'},{k:'servicos_terceiros', l:'Serviços de terceiros'},{k:'tarifas', l:'Tarifas bancárias'},{k:'outras_saidas', l:'Outras saídas'}]
  },
  pessoal: {
    entrada: [{k:'prolabore', l:'Pró-labore'},{k:'salario', l:'Salário'},{k:'emprestimo', l:'Empréstimo recebido'},{k:'presente', l:'Presente ou ajuda'},{k:'rendimento', l:'Rendimentos'},{k:'reembolso', l:'Reembolso'},{k:'outras_entradas', l:'Outras entradas pessoais'}],
    saida: [{k:'moradia', l:'Moradia'},{k:'alimentacao', l:'Alimentação'},{k:'supermercado', l:'Supermercado'},{k:'transporte', l:'Transporte / Uber'},{k:'saude', l:'Saúde'},{k:'educacao', l:'Educação'},{k:'lazer', l:'Lazer'},{k:'familia', l:'Família e filhos'},{k:'vestuario', l:'Vestuário'},{k:'contas', l:'Contas e assinaturas'},{k:'emprestimo_pagamento', l:'Pagamento de empréstimo'},{k:'cartao', l:'Cartão de crédito'},{k:'outras_saidas', l:'Outras saídas pessoais'}]
  }
};

let state = { accounts: [], transactions: [], recurring: [], activeTab: 'dashboard', reportScope: 'todos', month: null, ready: false };
const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

function fmt(n){ return (Number(n)||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'}); }
function todayISO(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

async function loadAll(){
  try{ const a = await StorageProvider.get('fin_accounts'); state.accounts = a && a.value ? JSON.parse(a.value) : []; }catch(e){ state.accounts = []; }
  try{ const t = await StorageProvider.get('fin_transactions'); state.transactions = t && t.value ? JSON.parse(t.value) : []; }catch(e){ state.transactions = []; }
  try{ const r = await StorageProvider.get('fin_recurring'); state.recurring = r && r.value ? JSON.parse(r.value) : []; }catch(e){ state.recurring = []; }
  const now = new Date(); state.month = {y: now.getFullYear(), m: now.getMonth()}; state.ready = true; render();
}

async function saveAccounts(){ await StorageProvider.set('fin_accounts', JSON.stringify(state.accounts)); }
async function saveTransactions(){ await StorageProvider.set('fin_transactions', JSON.stringify(state.transactions)); }
async function saveRecurring(){ await StorageProvider.set('fin_recurring', JSON.stringify(state.recurring)); }

function txInMonth(tx, y, m){ if(!tx.date) return false; const parts = tx.date.split('-'); return parseInt(parts[0], 10) === y && (parseInt(parts[1], 10) - 1) === m; }
function monthTx(scope){ return state.transactions.filter(t => (!scope || t.scope===scope) && txInMonth(t, state.month.y, state.month.m)); }
function sumBy(list, type){ return list.filter(t=>t.type===type).reduce((s,t)=>s+Number(t.amount||0),0); }

function accountBalance(accId){
  const acc = state.accounts.find(a=>a.id===accId); if(!acc) return 0;
  let bal = Number(acc.initialBalance||0);
  state.transactions.forEach(t=>{ if(t.accountId===accId){ bal += (t.type==='entrada' ? Number(t.amount||0) : -Number(t.amount||0)); }});
  return bal;
}
function totalBalanceByType(type){ return state.accounts.filter(a => type==='pessoal' ? a.type==='pessoal' : a.type!=='pessoal').reduce((s,a)=>s+accountBalance(a.id),0); }
function catLabel(scope,type,key){ if(!CATS[scope] || !CATS[scope][type]) return key; const found = CATS[scope][type].find(c=>c.k===key); return found ? found.l : key; }

function toggleBalances(){
  const hidden = document.body.classList.toggle('hide-balances');
  document.getElementById('eyeIcon').innerHTML = hidden
    ? '<path d="M3 3l18 18" stroke-linecap="round"/><path d="M10.6 10.6a3 3 0 004.2 4.2"/><path d="M9.5 5.3A10.9 10.9 0 0112 5c6.4 0 10 7 10 7a17.7 17.7 0 01-3.2 4.1M6.6 6.6C4 8.3 2 12 2 12s3.6 7 10 7c1.4 0 2.6-.3 3.7-.8"/>'
    : '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>';
}
function setTab(tab){ state.activeTab = tab; render(); document.getElementById('content').scrollTop = 0; }
function shiftMonth(delta){ let m = state.month.m + delta; let y = state.month.y; if(m<0){m=11; y--;} if(m>11){m=0; y++;} state.month = {y,m}; render(); }

function monthSwitchHTML(){
  return `<div class="month-switch">
    <div class="m-label">${MONTHS[state.month.m]} de ${state.month.y}</div>
    <div class="m-btns"><button class="m-btn" onclick="shiftMonth(-1)">‹</button><button class="m-btn" onclick="shiftMonth(1)">›</button></div>
  </div>`;
}

function flowTotals(list, type){
  const totals = {};
  list.filter(t=>t.type===type).forEach(t=>{
    const key = `${t.scope}|${t.category || 'outro'}`;
    totals[key] = (totals[key] || 0) + Number(t.amount || 0);
  });
  return Object.entries(totals).map(([key, amount])=>{
    const [scope, category] = key.split('|');
    return {scope, category, amount, label:catLabel(scope,type,category)};
  }).sort((a,b)=>b.amount-a.amount);
}

function flowRows(list, type){
  const rows = flowTotals(list,type).slice(0,5);
  if(!rows.length) return '<div class="empty" style="padding:12px 0">Sem dados neste mês.</div>';
  const max = rows[0].amount || 1;
  return rows.map(r=>`<div class="flow-row">
    <div class="flow-name">${r.label}<small>${r.scope==='empresa'?'Empresa':'Pessoal'}</small></div>
    <div class="flow-bar ${type==='entrada'?'in':'out'}"><i style="width:${Math.max(5,r.amount/max*100)}%"></i></div>
    <div class="flow-value ${type==='entrada'?'in':'out'}">${fmt(r.amount)}</div>
  </div>`).join('');
}

function financialTips(list){
  if(!list.length) return ['Adicione seus primeiros lançamentos para receber uma análise personalizada do seu fluxo.'];
  const entradas = sumBy(list,'entrada');
  const saidas = sumBy(list,'saida');
  const tips = [];
  const outRows = flowTotals(list,'saida');
  const inRows = flowTotals(list,'entrada');
  if(saidas > entradas) tips.push(`Suas saídas superam as entradas em ${fmt(saidas-entradas)} neste mês. Revise os gastos não essenciais antes de assumir novos compromissos.`);
  if(outRows[0] && saidas > 0 && outRows[0].amount/saidas >= .4) tips.push(`${outRows[0].label} concentra ${Math.round(outRows[0].amount/saidas*100)}% das suas saídas. Defina um limite para essa categoria e acompanhe-o semanalmente.`);
  if(inRows[0] && entradas > 0) tips.push(`Sua maior fonte de entradas é ${inRows[0].label} (${fmt(inRows[0].amount)}). Evite depender de uma única fonte e mantenha uma reserva para meses mais fracos.`);
  if(entradas > saidas && entradas > 0) tips.push(`Você fechou o mês com saldo positivo de ${fmt(entradas-saidas)}. Considere direcionar parte desse valor para uma reserva de emergência.`);
  if(!inRows.length) tips.push('Não há entradas registradas neste mês. Cadastre receitas e recebimentos para medir o resultado real do período.');
  if(!tips.length) tips.push('Seu fluxo está equilibrado. Continue categorizando os lançamentos para identificar oportunidades de economia.');
  return tips.slice(0,4);
}

function renderFlowInsights(list){
  const tips = financialTips(list);
  return `<div class="section-title">Onde está seu dinheiro?</div>
    <div class="card flow-card"><h4>Maiores entradas</h4><p class="hint">Categorias com maior participação nas entradas do mês.</p>${flowRows(list,'entrada')}</div>
    <div class="card flow-card"><h4>Maiores saídas</h4><p class="hint">Categorias que mais impactaram seu orçamento.</p>${flowRows(list,'saida')}</div>
    <div class="card tips-card"><h4 style="margin-bottom:10px">Dicas para este fluxo</h4>${tips.map((tip,i)=>`<div class="tip"><span class="tip-mark">${i+1}</span><span>${tip}</span></div>`).join('')}</div>`;
}

function renderDashboard(){
  const mt = monthTx();
  const empTx = mt.filter(t=>t.scope==='empresa');
  const pesTx = mt.filter(t=>t.scope==='pessoal');
  return `
    ${monthSwitchHTML()}
    <div class="quick-actions">
      <div class="quick-action empresa" onclick="openTxSheet('empresa')"><div class="qa-icon">+</div><div><div class="qa-label">Lançamento</div><div class="qa-sub">Empresa</div></div></div>
      <div class="quick-action pessoal" onclick="openTxSheet('pessoal')"><div class="qa-icon">+</div><div><div class="qa-label">Lançamento</div><div class="qa-sub">Pessoal</div></div></div>
    </div>
    <div class="hero-row">
      <div class="hero-split empresa"><div class="label"><span class="dot empresa"></span> Empresa</div><div class="value">${fmt(totalBalanceByType('empresa'))}</div></div>
      <div class="hero-split pessoal"><div class="label"><span class="dot pessoal"></span> Pessoal</div><div class="value">${fmt(totalBalanceByType('pessoal'))}</div></div>
    </div>
    <div class="section-title">Resumo do Mês</div>
    <div class="scope-grid">
      <div class="scope-col">
        <div class="scope-col-title"><span class="dot empresa"></span> Empresa</div>
        <div class="mini-card in"><div class="lbl">Entradas</div><div class="val">${fmt(sumBy(empTx,'entrada'))}</div></div>
        <div class="mini-card out"><div class="lbl">Saídas</div><div class="val">${fmt(sumBy(empTx,'saida'))}</div></div>
      </div>
      <div class="scope-col">
        <div class="scope-col-title"><span class="dot pessoal"></span> Pessoal</div>
        <div class="mini-card in"><div class="lbl">Entradas</div><div class="val">${fmt(sumBy(pesTx,'entrada'))}</div></div>
        <div class="mini-card out"><div class="lbl">Saídas</div><div class="val">${fmt(sumBy(pesTx,'saida'))}</div></div>
      </div>
    </div>
    ${renderFlowInsights(mt)}
  `;
}

function renderScope(scope){
  const label = scope==='empresa' ? 'Empresa' : 'Pessoal';
  const mt = monthTx(scope);
  return `
    <div class="head-scope"><div class="h-title ${scope}">${label}</div></div>
    ${monthSwitchHTML()}
    <div class="grid-2">
      <div class="mini-card in"><div class="lbl">Entradas</div><div class="val">${fmt(sumBy(mt,'entrada'))}</div></div>
      <div class="mini-card out"><div class="lbl">Saídas</div><div class="val">${fmt(sumBy(mt,'saida'))}</div></div>
    </div>
    <button class="btn-primary ${scope}" onclick="openTxSheet('${scope}')">+ Novo lançamento</button>
  `;
}

function reportCategories(list, type){
  const totals = {};
  list.filter(t=>t.type===type).forEach(t=>{
    const key = t.category || 'outro';
    totals[key] = (totals[key] || 0) + Number(t.amount || 0);
  });
  return Object.entries(totals).sort((a,b)=>b[1]-a[1]);
}

function reportRows(list, scope, type){
  const rows = reportCategories(list.filter(t=>!scope || t.scope===scope), type);
  if(!rows.length) return '<div class="empty" style="padding:16px 4px">Sem lançamentos neste período.</div>';
  const max = rows[0][1] || 1;
  return rows.map(([key, amount])=>{
    const source = list.find(t=>t.category===key && t.type===type);
    const label = catLabel(source ? source.scope : (scope || 'empresa'), type, key);
    return `
    <div class="report-row ${type==='saida'?'out':'in'}">
      <div class="name">${label}</div>
      <div class="bar-wrap"><div class="bar" style="width:${Math.max(4, amount/max*100)}%"></div></div>
      <div class="amount">${fmt(amount)}</div>
    </div>`;
  }).join('');
}

function renderReports(){
  const mt = monthTx();
  const selected = state.reportScope==='todos' ? mt : mt.filter(t=>t.scope===state.reportScope);
  const entradas = sumBy(selected, 'entrada');
  const saidas = sumBy(selected, 'saida');
  const saldo = entradas - saidas;
  const scopeLabel = state.reportScope==='todos' ? 'Todos' : (state.reportScope==='empresa' ? 'Empresa' : 'Pessoal');
  return `
    ${monthSwitchHTML()}
    <div class="pdf-actions">
      <button class="pdf-btn empresa" onclick="printReport('empresa')">PDF Empresa</button>
      <button class="pdf-btn pessoal" onclick="printReport('pessoal')">PDF Pessoal</button>
    </div>
    <div class="report-filter">
      <button class="${state.reportScope==='todos'?'active':''}" onclick="setReportScope('todos')">Todos</button>
      <button class="${state.reportScope==='empresa'?'active':''}" onclick="setReportScope('empresa')">Empresa</button>
      <button class="${state.reportScope==='pessoal'?'active':''}" onclick="setReportScope('pessoal')">Pessoal</button>
    </div>
    <div class="section-title" style="margin-top:0">Resumo — ${scopeLabel}</div>
    <div class="report-summary">
      <div class="report-card in"><div class="lbl">Entradas</div><div class="val">${fmt(entradas)}</div></div>
      <div class="report-card out"><div class="lbl">Saídas</div><div class="val">${fmt(saidas)}</div></div>
      <div class="report-card balance"><div class="lbl">Saldo do mês</div><div class="val">${fmt(saldo)}</div></div>
      <div class="report-card total"><div class="lbl">Lançamentos</div><div class="val">${selected.length}</div></div>
    </div>
    <div class="section-title">Entradas por categoria</div>
    <div class="card report-scope">${reportRows(selected, null, 'entrada')}</div>
    <div class="section-title">Saídas por categoria</div>
    <div class="card report-scope">${reportRows(selected, null, 'saida')}</div>
  `;
}

function setReportScope(scope){ state.reportScope = scope; render(); }

function printReport(scope){
  const list = monthTx(scope);
  const entradas = sumBy(list, 'entrada');
  const saidas = sumBy(list, 'saida');
  const saldo = entradas - saidas;
  const title = scope==='empresa' ? 'Relatório Financeiro — Empresa' : 'Relatório Financeiro — Pessoal';
  const rows = (type) => {
    const cats = reportCategories(list, type);
    const max = cats[0] ? cats[0][1] : 1;
    if(!cats.length) return '<p class="muted">Sem lançamentos neste período.</p>';
    return cats.map(([key, amount])=>`<div class="row"><span>${catLabel(scope,type,key)}</span><div class="track"><i style="width:${Math.max(4, amount/max*100)}%"></i></div><b>${fmt(amount)}</b></div>`).join('');
  };
  const w = window.open('', '_blank');
  if(!w){ alert('Permita pop-ups para gerar o PDF.'); return; }
  w.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><title>${title}</title><style>
    *{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#1A1D1E;margin:0;padding:32px;background:#fff}h1{font-size:24px;margin:0 0 5px;color:${scope==='empresa'?'#065F3A':'#475569'}}h2{font-size:16px;margin:28px 0 10px;border-bottom:2px solid #E0E0E0;padding-bottom:7px}.sub{color:#6C757D;font-size:13px;margin-bottom:22px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid #E0E0E0;border-radius:10px;padding:14px}.label{font-size:11px;color:#6C757D}.value{font-size:18px;font-weight:bold;margin-top:6px}.in{color:#065F3A}.out{color:#E53935}.balance{color:#475569}.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #EEF2F6;font-size:13px}.row span{width:150px}.track{height:9px;background:#EEF2F6;border-radius:6px;flex:1;overflow:hidden}.track i{display:block;height:100%;background:${scope==='empresa'?'#0A8754':'#475569'};border-radius:6px}.row b{width:90px;text-align:right}.muted{color:#6C757D;font-size:13px}@media print{body{padding:0}.no-print{display:none}} </style></head><body>
    <h1>${title}</h1><div class="sub">${MONTHS[state.month.m]} de ${state.month.y} · Gerado pelo LCS Finanças</div>
    <div class="summary"><div class="card"><div class="label">Entradas</div><div class="value in">${fmt(entradas)}</div></div><div class="card"><div class="label">Saídas</div><div class="value out">${fmt(saidas)}</div></div><div class="card"><div class="label">Saldo do mês</div><div class="value balance">${fmt(saldo)}</div></div></div>
    <h2>Entradas por categoria</h2>${rows('entrada')}<h2>Saídas por categoria</h2>${rows('saida')}
    <p class="sub">Total de lançamentos: ${list.length}</p><button class="no-print" onclick="window.print()">Salvar / imprimir PDF</button>
    </body></html>`);
  w.document.close();
}

function render(){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===state.activeTab));
  const c = document.getElementById('content');
  if(!state.ready){ c.innerHTML = '<div class="empty">Carregando...</div>'; return; }
  if(state.activeTab==='dashboard') c.innerHTML = renderDashboard();
  else if(state.activeTab==='empresa') c.innerHTML = renderScope('empresa');
  else if(state.activeTab==='pessoal') c.innerHTML = renderScope('pessoal');
  else if(state.activeTab==='relatorios') c.innerHTML = renderReports();
  else c.innerHTML = `<div class="empty">Aba em desenvolvimento.</div>`;
}

function closeSheet(){ document.getElementById('overlay').classList.remove('show'); }
function openSheetHTML(html){ document.getElementById('sheet').innerHTML = `<div class="sheet-handle"></div>` + html; document.getElementById('overlay').classList.add('show'); }

let txDraft = null;
function openTxSheet(scope){
  txDraft = { id: uid(), scope, type:'entrada', category: CATS[scope].entrada[0].k, amount:'', date: todayISO(), accountId: '', description:'' };
  renderTxSheet();
}
function setTxType(type){
  txDraft.type = type;
  txDraft.category = CATS[txDraft.scope][type][0].k;
  renderTxSheet();
}
function setTxCategory(value){ txDraft.category = value; }
function renderTxSheet(){
  const cats = CATS[txDraft.scope][txDraft.type];
  const accounts = state.accounts.filter(a=>txDraft.scope==='pessoal' ? a.type==='pessoal' : a.type!=='pessoal');
  const html = `
    <h3>Novo lançamento — ${txDraft.scope==='empresa'?'Empresa':'Pessoal'}</h3>
    <div class="toggle-row">
      <button class="toggle-opt ${txDraft.type==='entrada'?'sel-in':''}" onclick="setTxType('entrada')">Entrada</button>
      <button class="toggle-opt ${txDraft.type==='saida'?'sel-out':''}" onclick="setTxType('saida')">Saída</button>
    </div>
    <div class="field"><label>Categoria</label><select onchange="setTxCategory(this.value)">${cats.map(c=>`<option value="${c.k}" ${c.k===txDraft.category?'selected':''}>${c.l}</option>`).join('')}</select></div>
    <div class="field"><label>Valor (R$)</label><input type="number" step="0.01" min="0" id="tx-amt" value="${txDraft.amount}" oninput="txDraft.amount=this.value" placeholder="0,00"></div>
    <div class="field"><label>Data</label><input type="date" value="${txDraft.date}" onchange="txDraft.date=this.value"></div>
    <div class="field"><label>Descrição (opcional)</label><input type="text" maxlength="80" value="${txDraft.description}" oninput="txDraft.description=this.value" placeholder="Ex.: Uber para reunião"></div>
    <div class="field"><label>Conta (opcional)</label><select onchange="txDraft.accountId=this.value"><option value="">Sem conta vinculada</option>${accounts.map(a=>`<option value="${a.id}" ${a.id===txDraft.accountId?'selected':''}>${a.name}</option>`).join('')}</select></div>
    <div class="sheet-actions">
      <button class="btn ghost" onclick="closeSheet()">Cancelar</button>
      <button class="btn save" onclick="saveTx()">Salvar</button>
    </div>
  `;
  openSheetHTML(html);
}
function saveTx(){
  if(!txDraft.amount || Number(txDraft.amount)<=0){ alert('Valor inválido.'); return; }
  if(!txDraft.date){ alert('Informe a data.'); return; }
  state.transactions.push({...txDraft, amount: Number(txDraft.amount)});
  saveTransactions(); closeSheet(); render();
}

loadAll();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
  }
</script>
</body>
